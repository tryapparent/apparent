[package]
name = "apparent-inspect"
version = "0.1.0"
edition = "2024"
license = "MIT"
[lib]
path = "lib.rs"
[[bin]]
name = "apparent-inspect"
path = "main.rs"
[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
hound = "3.5.1"
