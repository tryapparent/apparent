<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Access · Apparent</title><link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body class="login-page"><main class="login-panel"><p class="eyebrow">Apparent product</p><h1>Document operations, under control.</h1><p>Enter the installation access password to continue.</p>{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="mb-4"><label class="form-label" for="password">Access password</label><input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required autofocus></div><button class="btn btn-primary btn-lg" type="submit">Open workspace</button></form></main></body></html>
