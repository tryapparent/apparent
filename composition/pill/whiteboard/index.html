<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'">
    <title>Apparent Whiteboard</title>
    <link rel="stylesheet" href="view.css">
  </head>
  <body>
    <main id="opening" class="whiteboard" tabindex="-1" autofocus aria-describedby="opening-status">
      <header>
        <h1>Whiteboard</h1>
        <button id="close-opening" type="button" aria-label="Close whiteboard"><span aria-hidden="true">×</span></button>
      </header>
      <p id="opening-status" role="status">Opening Whiteboard…</p>
    </main>
    <div id="root"></div>
    <script src="view.js" defer></script>
  </body>
</html>
