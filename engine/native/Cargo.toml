[package]
name = "apparent-engine-media"
version = "0.4.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Finite local movie metadata, frame and audio capabilities"

[[bin]]
name = "apparent-engine-media"
path = "src/main.rs"

[[bin]]
name = "apparent-engine-frames"
path = "src/frames_main.rs"
required-features = ["frames"]

[[bin]]
name = "apparent-engine-audio"
path = "src/audio_main.rs"
required-features = ["audio"]

[features]
frames = ["dep:libc", "dep:serde", "dep:serde_json", "dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
audio = ["dep:libc", "dep:gstreamer", "dep:gstreamer-app", "dep:objc2", "dep:objc2-av-foundation", "dep:objc2-core-media", "dep:objc2-foundation", "dep:objc2-audio-toolbox", "dep:objc2-core-audio-types", "dep:objc2-core-foundation", "dep:objc2-avf-audio"]

[dependencies]
libc = { version = "=0.2.189", optional = true }
serde = { version = "=1.0.229", features = ["derive"], optional = true }
serde_json = { version = "=1.0.151", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", optional = true }
objc2-av-foundation = { optional = true, version = "=0.3.2", default-features = false, features = ["std", "AVAsset", "AVAssetReader", "AVAudioMix", "AVAssetReaderOutput", "AVAssetTrack", "AVMediaFormat", "objc2-core-media"] }
objc2-core-media = { optional = true, version = "=0.3.2", default-features = false, features = ["std", "CMBase", "CMAttachment", "CMSampleBuffer", "CMFormatDescription", "CMTime", "CMBlockBuffer", "objc2-core-audio-types"] }
objc2-foundation = { optional = true, version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSValue", "NSString", "NSURL", "NSError"] }
objc2-audio-toolbox = { optional = true, version = "=0.3.2", default-features = false, features = ["std", "AudioConverter", "objc2-core-audio-types"] }
objc2-core-audio-types = { optional = true, version = "=0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { optional = true, version = "=0.3.2", default-features = false, features = ["std", "CFNumber", "CFDictionary"] }
objc2-avf-audio = { optional = true, version = "=0.3.2", default-features = false, features = ["std", "AVAudioSettings"] }
