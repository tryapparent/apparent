[package]
name = "apparent"
version = "0.22.15"
edition = "2024"
default-run = "apparent"
license = "MIT"

[[bin]]
name = "apparent"
path = "main.rs"

[dependencies]
apparent-connect-client = { path = "connect/client" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
dirs = "7.0.0"
flume = "0.12.0"
futures-lite = "2"
hound = "3.5.1"
libc = "0.2.189"
png = "0.18.1"
rquickjs = "=0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tiktoken-rs = "0.12.1"

[dev-dependencies]
apparent-connect-client = { path = "connect/client", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.10.0"
core-graphics = "0.24.0"
core-graphics-types = "0.1.3"
core-text = "21.0.0"
core-video = "0.4.3"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["AudioHardware", "objc2-core-audio-types"] }
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSData", "NSString"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer"] }
metal = "0.29.0"
screencapturekit = { version = "=11.0.0", features = ["macos_15_0"] }
sha2 = "0.10.9"
transcribe-cpp = { version = "=0.4.1", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
ab_glyph = "0.2.32"
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
# X11 only: GPUI 0.2.2's Wayland windows can't be placed or kept on top, so Apparent's windows
# go through XWayland on a Wayland session (see capture/desktop/docs/linux/linux.md).
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "x11"] }
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
qoi = "=0.4.1"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
lyon = "1.0.19"
sha2 = "0.10.9"
# Runtime CPU selection; never compile ggml for the CI runner's CPU (#82).
# x86_64 gets one module per ISA tier; aarch64 gets a portable CPU module.
transcribe-cpp = { version = "=0.4.1", default-features = false, features = ["dynamic-backends"] }
x11rb = { version = "0.13.1", features = ["allow-unsafe-code", "randr", "shape", "xfixes", "xinput", "xtest", "res"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.dev]
debug = 0
# Keep the large application crate quick to rebuild; hot dependencies retain
# their optimized dev settings below. Release builds use their own profile.
opt-level = 0

# GPUI 0.2.2 pins Taffy =0.9.0, whose registry manifest requires vulnerable grid 0.18.
# Keep its layout source unchanged while admitting grid >=1.0.1; see patch notes.
[patch.crates-io]
taffy = { path = "capture/desktop/vendor/taffy" }

[profile.dev.package."*"]
opt-level = 2
