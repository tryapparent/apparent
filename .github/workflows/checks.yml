name: Continuous delivery

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!capture/**"
      - "!record/**"
      - "!agent/**"
      - "!connect/**"
      - "!public/**"
      - "!hermes/**"
      - "!enablement/**"
      - "!shared/**"
      - "!composition/**"
      - "!.cargo/**"
      - "!.github/**"
      - "!.githooks/**"
      - "!engine/**"
      - "!AGENTS.md"
      - "!README.md"
      - "!Cargo.toml"
      - "!Cargo.lock"
      - "!build.rs"
      - "!main.rs"
      - "shared/**"
      - "composition/**"
      - "enablement/**"
      - ".github/**"
      - ".githooks/**"
      - "!.github/workflows/stream-engine.yml"
      - "!.github/workflows/stream-agent.yml"
      - "!.github/workflows/hermes.yml"
      - "!.github/workflows/stream-public.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "main.rs"
      - ".cargo/**"
      - ".github/workflows/verification-platform.yml"
      - "enablement/verification.py"
      - "enablement/prerequisites/**"
      - "enablement/local-tests/**"
      - "enablement/native-build/**"
      - "engine/permissions/**"
      - "capture/**"
      - "record/**"
      - "connect/**"
      - "agent/**"
      - "AGENTS.md"
      - "public/**"
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
    paths:
      - "**"
      - "!capture/**"
      - "!record/**"
      - "!agent/**"
      - "!connect/**"
      - "!public/**"
      - "!hermes/**"
      - "!enablement/**"
      - "!shared/**"
      - "!composition/**"
      - "!.cargo/**"
      - "!.github/**"
      - "!.githooks/**"
      - "!engine/**"
      - "!AGENTS.md"
      - "!README.md"
      - "!Cargo.toml"
      - "!Cargo.lock"
      - "!build.rs"
      - "!main.rs"
      - "shared/**"
      - "composition/**"
      - "enablement/**"
      - ".github/**"
      - ".githooks/**"
      - "!.github/workflows/stream-engine.yml"
      - "!.github/workflows/stream-agent.yml"
      - "!.github/workflows/hermes.yml"
      - "!.github/workflows/stream-public.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "main.rs"
      - ".cargo/**"
      - ".github/workflows/verification-platform.yml"
      - "enablement/verification.py"
      - "enablement/prerequisites/**"
      - "enablement/local-tests/**"
      - "enablement/native-build/**"
      - "engine/permissions/**"
      - "capture/**"
      - "record/**"
      - "connect/**"
      - "agent/**"
      - "AGENTS.md"
      - "public/**"

permissions:
  contents: read
  actions: read

# Main uses commit groups so docs cannot replace pending code verification.
# PR updates supersede active checks.
concurrency:
  group: repository-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  record-media:
    name: Record media policy
    needs: select
    if: >-
      !cancelled() && (needs.select.result != 'success' || fromJSON(needs.select.outputs.plan).root)
    runs-on: ubuntu-24.04
    container: node:22.23.0-bookworm-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Record and Agent policy without Rust, Electron or native outputs
        run: |
          if command -v cargo || command -v rustc; then exit 1; fi
          test ! -d target
          test ! -d capture/desktop/ui/frontend/node_modules
          node --experimental-strip-types record/enablement/ci/media.ts
          node --experimental-strip-types enablement/local-tests/run.ts --agent-media

  onboarding-policy:
    name: Onboarding policy
    needs: select
    if: >-
      !cancelled() && (needs.select.result != 'success' || fromJSON(needs.select.outputs.plan).onboarding)
    runs-on: ubuntu-24.04
    container: node:22.23.0-bookworm-slim
    timeout-minutes: 5
    defaults:
      run:
        working-directory: capture/desktop/ui/frontend
    steps:
      # checkout v4 uses its REST archive fallback without Git. These checks
      # need source files only, not repository history or native packages.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check policy from source without native tools or generated output
        run: |
          if command -v cargo || command -v rustc; then
            echo 'Policy checks must run without Rust tools.' >&2
            exit 1
          fi
          test ! -d node_modules
          test ! -d dist
          test ! -d ../../../../target
          node --experimental-strip-types ../../../../enablement/local-tests/run.ts --onboarding
          test ! -d node_modules/electron/dist
          test ! -d tests/onboarding/node_modules/electron

  # Main reuses only passed PR suites bound to its identical complete tree.
  # Missing evidence runs affected suites before exact-main publication admission.
  # PR checkout is GitHub's proposed merge, so these checks cover integration.
  # Draft updates retain cheap feedback without allocating full platform suites.
  linux:
    needs: [contracts, select, reuse, record-media]
    if: >-
      !cancelled() && needs.contracts.result == 'success' && (needs['record-media'].result == 'success' || needs['record-media'].result == 'skipped') &&
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
      && (needs.select.result != 'success' || needs.select.outputs.platform != 'false')
      && needs.reuse.outputs.linux != 'true'
    uses: ./.github/workflows/verification-platform.yml
    with:
      runner: ubuntu-24.04
      release_receipt: false
      portable: false
      plan: ${{ needs.select.outputs.plan }}

  release:
    name: Queue Main release
    needs: [linux-admission, select]
    concurrency:
      group: linux-main-dispatch
      cancel-in-progress: false
    # Reused/unselected suites intentionally skip ancestors. Override implicit
    # success(), while retaining the fresh exact-main Linux admission gate.
    if: >-
      !cancelled() && needs['linux-admission'].result == 'success' &&
      needs.select.result == 'success' &&
      needs.select.outputs.installer != 'false' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tryapparent/apparent'
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types composition/enablement/release/main/dispatch.ts

  macos:
    needs: [contracts, select, reuse, portable, record-media]
    if: >-
      !cancelled() && needs.contracts.result == 'success' && (needs['record-media'].result == 'success' || needs['record-media'].result == 'skipped') && (needs.portable.result == 'success' || needs.portable.result == 'skipped') &&
      github.event_name == 'workflow_dispatch'
      && (needs.select.result != 'success' || needs.select.outputs.macos != 'false' || needs.select.outputs.mac_rust == 'false')
      && (needs.select.result != 'success' || needs.select.outputs.platform != 'false')
      && needs.reuse.outputs.macos != 'true'
    uses: ./.github/workflows/verification-platform.yml
    with:
      runner: macos-15-intel
      release_receipt: false
      portable: false
      plan: ${{ needs.select.outputs.mac_plan }}
      mac_rust: ${{ !(needs.select.result == 'success' && needs.select.outputs.mac_rust == 'false') }}

  select:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      macos: ${{ steps.paths.outputs.macos }}
      mac_rust: ${{ steps.paths.outputs.mac_rust }}
      fixtureMac: ${{ steps.paths.outputs.fixtureMac }}
      public: ${{ steps.paths.outputs.public }}
      updater: ${{ steps.paths.outputs.updater }}
      platform: ${{ steps.paths.outputs.platform }}
      installer: ${{ steps.paths.outputs.installer }}
      plan: ${{ steps.paths.outputs.plan }}
      mac_plan: ${{ steps.paths.outputs.mac_plan }}
      hermes: ${{ steps.paths.outputs.hermes }}
      portable: ${{ steps.paths.outputs.portable }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - id: paths
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
        run: bun enablement/ci/select.ts --admit

  reuse:
    needs: select
    if: always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      linux: ${{ steps.evidence.outputs.linux }}
      macos: ${{ steps.evidence.outputs.macos }}
      portable: ${{ steps.evidence.outputs.portable }}
      hermes: ${{ steps.evidence.outputs.hermes }}
      hermes_macos: ${{ steps.evidence.outputs.hermes_macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_PLAN: ${{ needs.select.outputs.plan }}
          MAC_VERIFICATION_PLAN: ${{ needs.select.outputs.mac_plan }}
        run: node --experimental-strip-types enablement/ci/routing/evidence.ts --reuse


  updater:
    needs: select
    if: github.event_name == 'push' && needs.select.outputs.updater == 'true'
    uses: ./.github/workflows/linux-updater-harness.yml

  portable:
    needs: [contracts, select, reuse]
    if: >-
      !cancelled() && needs.contracts.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) &&
      (needs.select.result != 'success' || needs.select.outputs.portable != 'false') && needs.reuse.outputs.portable != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare hosted Ubuntu package transport
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-apt
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Resolve recipient FFmpeg archives
        id: ffmpeg_plan
        if: needs.select.result != 'success' || fromJSON(needs.select.outputs.plan).service
        run: node --experimental-strip-types connect/enablement/ci/recipient-ffmpeg.ts plan
      - uses: actions/cache/restore@v4
        id: ffmpeg_archives
        if: steps.ffmpeg_plan.outputs.key != ''
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/apparent-recipient-ffmpeg/archives
          key: ${{ steps.ffmpeg_plan.outputs.key }}
          restore-keys: recipient-ffmpeg-noble-amd64-v1-
      - name: Install recipient media fixture dependency
        if: needs.select.result != 'success' || fromJSON(needs.select.outputs.plan).service
        env:
          RECIPIENT_ARCHIVE_HIT: ${{ steps.ffmpeg_archives.outputs.cache-hit }}
        run: node --experimental-strip-types connect/enablement/ci/recipient-ffmpeg.ts install
      - uses: actions/cache/save@v4
        if: >-
          steps.ffmpeg_plan.outputs.key != '' && steps.ffmpeg_archives.outputs.cache-hit != 'true' &&
          github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/apparent-recipient-ffmpeg/archives
          key: ${{ steps.ffmpeg_plan.outputs.key }}
      - name: Install disk-image contract dependency (no KVM required)
        if: needs.select.result != 'success' || fromJSON(needs.select.outputs.plan).tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils
      - name: Install OCR preprocessing dependency
        if: needs.select.result != 'success' || fromJSON(needs.select.outputs.plan).tools
        run: python3 -m pip install Pillow
      - name: Verify affected Connect browser, service and capture drivers once
        env:
          VERIFICATION_PLAN: ${{ needs.select.outputs.plan }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node --experimental-strip-types enablement/ci/routing/run.ts --portable

  contracts:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Verify paired release contracts
        run: node --experimental-strip-types --test composition/enablement/release/*.test.ts composition/enablement/release/test/*.test.ts composition/enablement/release/mac/test.ts composition/enablement/release/mac/publication/*.test.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Verify theme, push guards, selection and publication admission
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
        run: python3 enablement/verification.py --base "$BASE_SHA" --pr
      - name: Verify the shared selected tooling suite
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
        run: node --experimental-strip-types enablement/local-tests/run.ts --tooling
      - name: Validate workflow syntax and job dependencies
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -shellcheck= -pyflakes= .github/workflows/checks.yml .github/workflows/linux-updater-harness.yml .github/workflows/verification.yml .github/workflows/verification-platform.yml .github/workflows/release-linux.yml .github/workflows/release-mac-preview.yml .github/workflows/stream-public.yml .github/workflows/stream-connect.yml .github/workflows/hermes.yml

  fixture-mac:
    name: Mac hook fixtures
    needs: [select, contracts]
    if: >-
      !cancelled() && needs.contracts.result == 'success' &&
      github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Real hook and dependency-install fixtures without native application builds
        run: node --experimental-strip-types enablement/local-tests/run.ts --fixture-mac

      - name: Supply same-attempt installation-contract evidence
        if: github.repository == 'tryapparent/apparent' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mac-install-contracts-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mac-install-contracts.json
          if-no-files-found: error
          retention-days: 2

  tree-evidence:
    needs: [select, contracts, linux, macos, portable, onboarding-policy, record-media, fixture-mac]
    if: always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.select.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - env:
          CI_NEEDS: ${{ toJSON(needs) }}
          VERIFICATION_PLAN: ${{ needs.select.outputs.plan }}
          MAC_VERIFICATION_PLAN: ${{ needs.select.outputs.mac_plan }}
        run: node --experimental-strip-types enablement/ci/routing/evidence.ts --write
      - uses: actions/upload-artifact@v4
        with:
          name: ci-tree-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-tree.json
          retention-days: 14

  linux-admission:
    name: Linux verification
    needs: [select, contracts, reuse, linux, portable, onboarding-policy, record-media]
    if: always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_REUSE: ${{ toJSON(needs.reuse.outputs) }}
          VERIFICATION_PLAN: ${{ needs.select.outputs.plan }}
          MAC_VERIFICATION_PLAN: ${{ needs.select.outputs.mac_plan }}
          VERIFY_PLATFORM: linux
        run: node --experimental-strip-types enablement/ci/routing/evidence.ts --admit

  macos-admission:
    name: Mac verification
    needs: [select, contracts, reuse, macos, portable, onboarding-policy, record-media, fixture-mac]
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_REUSE: ${{ toJSON(needs.reuse.outputs) }}
          VERIFICATION_PLAN: ${{ needs.select.outputs.plan }}
          MAC_VERIFICATION_PLAN: ${{ needs.select.outputs.mac_plan }}
          VERIFY_PLATFORM: macos
          FIXTURE_MAC: 'true'
        run: node --experimental-strip-types enablement/ci/routing/evidence.ts --admit
