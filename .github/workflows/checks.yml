name: Continuous delivery

on:
  pull_request:
    branches: [main]
    paths:
      - "shared/**"
      - "composition/**"
      - "enablement/ci/**"
      - ".github/actions/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "main.rs"
      - ".cargo/**"
      - ".github/workflows/verification-platform.yml"
      - "enablement/verification.py"
      - "enablement/prerequisites/**"
      - "enablement/local-tests/**"
      - "enablement/native-build/**"
      - "capture/**"
      - "record/**"
      - "connect/client/**"
      - "connect/hosted.rs"
      - "connect/mod.rs"
      - "enablement/**"
      - ".githooks/**"
      - "AGENTS.md"
      - ".github/workflows/checks.yml"
      - ".github/workflows/verification.yml"
      - ".github/workflows/verification-mac.yml"
      - ".github/workflows/release-linux.yml"
      - ".github/workflows/release-mac-preview.yml"
      - ".github/workflows/linux-updater-harness.yml"
      - "public/site/public/assets/brand/apparent-wordmark.svg"
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "composition/**"
      - "enablement/ci/**"
      - ".github/actions/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "main.rs"
      - ".cargo/**"
      - ".github/workflows/verification-platform.yml"
      - "enablement/verification.py"
      - "enablement/prerequisites/**"
      - "enablement/local-tests/**"
      - "enablement/native-build/**"
      - "capture/**"
      - "record/**"
      - "connect/client/**"
      - "connect/hosted.rs"
      - "connect/mod.rs"
      - "enablement/**"
      - ".githooks/**"
      - "AGENTS.md"
      - ".github/workflows/checks.yml"
      - ".github/workflows/verification.yml"
      - ".github/workflows/verification-mac.yml"
      - ".github/workflows/release-linux.yml"
      - ".github/workflows/release-mac-preview.yml"
      - ".github/workflows/linux-updater-harness.yml"
      - "public/site/public/assets/brand/apparent-wordmark.svg"

permissions:
  contents: read
  actions: read

# Main uses commit groups so docs cannot replace pending code verification.
# PR updates supersede active checks.
concurrency:
  group: repository-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Main reuses only passed PR suites bound to its identical complete tree.
  # Missing evidence runs affected suites before exact-main publication admission.
  # PR checkout is GitHub's proposed merge, so these checks cover integration.
  # Draft updates retain cheap feedback without allocating full platform suites.
  linux:
    needs: [contracts, select, reuse, portable]
    if: >-
      !cancelled() && needs.contracts.result == 'success' && (needs.portable.result == 'success' || needs.portable.result == 'skipped') &&
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
      && (needs.select.result != 'success' || needs.select.outputs.platform != 'false')
      && needs.reuse.outputs.linux != 'true'
    uses: ./.github/workflows/verification-platform.yml
    with:
      runner: ubuntu-24.04
      release_receipt: false
      portable: false
      plan: ${{ needs.select.outputs.plan }}

  release-linux:
    needs: [linux-admission, select]
    # Reused/unselected suites intentionally skip ancestors. Override implicit
    # success(), while retaining the fresh exact-main Linux admission gate.
    if: >-
      !cancelled() && needs['linux-admission'].result == 'success' &&
      needs.select.result == 'success' &&
      (needs.select.outputs.hermes != 'true' || needs.select.outputs.platform != 'false' || needs.select.outputs.portable != 'false' || needs.select.outputs.public != 'false') &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tryapparent/apparent'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-linux.yml
    with:
      publish_main: true
    secrets:
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      APPARENT_POSTHOG_TOKEN: ${{ secrets.APPARENT_POSTHOG_TOKEN }}

  macos:
    # Share the cheap admission barrier; neither full platform waits for the other.
    needs: [contracts, select, reuse, portable]
    # Only a successful explicit false can exempt a reviewed ready-PR delta.
    # Renderer-only PRs retain Electron; only their root Rust job is omitted.
    # Failed/unknown selection keeps Mac coverage after the cheap guards pass.
    if: >-
      !cancelled() && needs.contracts.result == 'success' && (needs.portable.result == 'success' || needs.portable.result == 'skipped') &&
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
      && (needs.select.result != 'success' || needs.select.outputs.macos != 'false' || needs.select.outputs.mac_rust == 'false')
      && (needs.select.result != 'success' || needs.select.outputs.platform != 'false')
      && needs.reuse.outputs.macos != 'true'
    uses: ./.github/workflows/verification-platform.yml
    with:
      runner: macos-15-intel
      release_receipt: false
      portable: false
      plan: ${{ needs.select.outputs.mac_plan }}
      mac_rust: ${{ !(needs.select.result == 'success' && needs.select.outputs.mac_rust == 'false') }}

  select:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      macos: ${{ steps.paths.outputs.macos }}
      mac_rust: ${{ steps.paths.outputs.mac_rust }}
      public: ${{ steps.paths.outputs.public }}
      updater: ${{ steps.paths.outputs.updater }}
      platform: ${{ steps.paths.outputs.platform }}
      plan: ${{ steps.paths.outputs.plan }}
      mac_plan: ${{ steps.paths.outputs.mac_plan }}
      hermes: ${{ steps.paths.outputs.hermes }}
      portable: ${{ steps.paths.outputs.portable }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun enablement/ci/select.ts

  reuse:
    needs: select
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    outputs:
      linux: ${{ steps.evidence.outputs.linux }}
      macos: ${{ steps.evidence.outputs.macos }}
      portable: ${{ steps.evidence.outputs.portable }}
      hermes: ${{ steps.evidence.outputs.hermes }}
      hermes_macos: ${{ steps.evidence.outputs.hermes_macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_PLAN: ${{ needs.select.outputs.plan }}
          MAC_VERIFICATION_PLAN: ${{ needs.select.outputs.mac_plan }}
        run: node --experimental-strip-types enablement/ci/routing/evidence.ts --reuse


  updater:
    needs: select
    if: github.event_name == 'push' && needs.select.outputs.updater == 'true'
    uses: ./.github/workflows/linux-updater-harness.yml

  portable:
    needs: [contracts, select, reuse]
    if: >-
      !cancelled() && needs.contracts.result == 'success' &&
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)) &&
      (needs.select.result != 'success' || needs.select.outputs.portable != 'false') && needs.reuse.outputs.portable != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare hosted Ubuntu package transport
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-apt
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Install recipient media fixture dependency
        if: needs.select.result != 'success' || fromJSON(needs.select.outputs.plan).service
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install disk-image contract dependency (no KVM required)
        if: needs.select.result != 'success' || fromJSON(needs.select.outputs.plan).tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils
      - name: Install OCR preprocessing dependency
        if: needs.select.result != 'success' || fromJSON(needs.select.outputs.plan).tools
        run: python3 -m pip install Pillow
      - name: Verify affected Connect browser, service and capture drivers once
        env:
          VERIFICATION_PLAN: ${{ needs.select.outputs.plan }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node --experimental-strip-types enablement/ci/routing/run.ts --portable

  contracts:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Verify early native prerequisite contracts
        run: |
          node --experimental-strip-types --test enablement/prerequisites/*.test.ts
          node --experimental-strip-types --test enablement/timing/mac-cache.test.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun test enablement/ci/
      - name: Verify theme, push guards, selection and publication admission
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 enablement/verification.py --base "$BASE_SHA" --pr
      - name: Validate workflow syntax and job dependencies
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -shellcheck= -pyflakes= .github/workflows/checks.yml .github/workflows/linux-updater-harness.yml .github/workflows/verification.yml .github/workflows/verification-mac.yml .github/workflows/verification-platform.yml .github/workflows/release-linux.yml .github/workflows/release-mac-preview.yml .github/workflows/stream-public.yml .github/workflows/stream-connect.yml .github/workflows/hermes.yml

  tree-evidence:
    needs: [select, contracts, linux, macos, portable]
    if: always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.select.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - env:
          CI_NEEDS: ${{ toJSON(needs) }}
          VERIFICATION_PLAN: ${{ needs.select.outputs.plan }}
          MAC_VERIFICATION_PLAN: ${{ needs.select.outputs.mac_plan }}
        run: node --experimental-strip-types enablement/ci/routing/evidence.ts --write
      - uses: actions/upload-artifact@v4
        with:
          name: ci-tree-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-tree.json
          retention-days: 14

  linux-admission:
    name: Linux verification
    needs: [select, contracts, reuse, linux, portable]
    if: always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_REUSE: ${{ toJSON(needs.reuse.outputs) }}
          VERIFICATION_PLAN: ${{ needs.select.outputs.plan }}
          MAC_VERIFICATION_PLAN: ${{ needs.select.outputs.mac_plan }}
          VERIFY_PLATFORM: linux
        run: node --experimental-strip-types enablement/ci/routing/evidence.ts --admit

  macos-admission:
    name: Mac verification
    needs: [select, contracts, reuse, macos, portable]
    if: always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_REUSE: ${{ toJSON(needs.reuse.outputs) }}
          VERIFICATION_PLAN: ${{ needs.select.outputs.plan }}
          MAC_VERIFICATION_PLAN: ${{ needs.select.outputs.mac_plan }}
          VERIFY_PLATFORM: macos
        run: node --experimental-strip-types enablement/ci/routing/evidence.ts --admit
