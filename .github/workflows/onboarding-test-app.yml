name: Onboarding test app

on:
  push:
    branches: [preview/onboarding-attached]
    paths:
      - '.github/workflows/onboarding-test-app.yml'
      - 'capture/desktop/**'
      - 'capture/engine/**'
      - 'shared/**'
      - 'main.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.cargo/**'
      - 'composition/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onboarding-test-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'tryapparent/apparent' && github.ref == 'refs/heads/preview/onboarding-attached'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: Apple-Silicon
          - runner: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: onboarding-test-app-${{ matrix.arch }}
          cache-on-failure: true
      - name: Select the macOS 26 SDK on Intel
        if: matrix.arch == 'Intel'
        run: |
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Prepare native compiler and locked dependencies
        run: |
          xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
          cargo fetch --locked
      - name: Build the separate test app and installer
        env:
          CARGO_NET_OFFLINE: 'true'
          APPARENT_TEST_OUTPUT: ${{ runner.temp }}/onboarding-test-output
        run: bash capture/desktop/scripts/packaging/build-onboarding-test.sh
      - name: Verify installer and practice state
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          xcrun swiftc -D INSTALLER_TEST -parse-as-library capture/desktop/native/installer/LocalInstaller.swift -o "$RUNNER_TEMP/installer-check"
          "$RUNNER_TEMP/installer-check"
          cargo test -j 3 --offline settings::practice -- --test-threads=2
          cargo test -j 3 --offline coaching_finishes_after_completion_pill_dismissal -- --test-threads=2
          cargo test -j 3 --offline menu_retry_cannot_inherit_completed_shortcut_attempt -- --test-threads=2
          (cd "$RUNNER_TEMP/onboarding-test-output" && shasum -a 256 Apparent-Onboarding-Test.zip > SHA256SUMS)
          {
            git rev-parse HEAD
            uname -m
            sw_vers
          } > "$RUNNER_TEMP/onboarding-test-output/BUILD-INFO.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Apparent-Onboarding-Test-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/onboarding-test-output/Apparent-Onboarding-Test.zip
            ${{ runner.temp }}/onboarding-test-output/SHA256SUMS
            ${{ runner.temp }}/onboarding-test-output/BUILD-INFO.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
