name: Performance benchmark
run-name: Performance benchmark (${{ inputs.stream }}, ${{ inputs.control }}, ${{ inputs.candidate }})
on:
  workflow_dispatch:
    inputs:
      stream:
        description: Reviewed benchmark stream
        type: choice
        options: [handoff, onboarding, connect, agent, public, hermes, record-start, record-stop, record-native-probe]
        required: true
      control:
        description: Full control commit SHA on main
        type: string
        required: true
      candidate:
        description: Full reviewed candidate SHA (same as control for calibration only)
        type: string
        required: true
permissions:
  contents: read
jobs:
  measure:
    if: github.repository == 'tryapparent/apparent' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.stream == 'record-stop' && 45 || 30 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
      - name: Run owner benchmark
        env:
          PERFORMANCE_STREAM: ${{ inputs.stream }}
          PERFORMANCE_CONTROL: ${{ inputs.control }}
          PERFORMANCE_CANDIDATE: ${{ inputs.candidate }}
        run: node enablement/timing/hosted/run.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-evidence
          path: ${{ runner.temp }}/performance-evidence
          if-no-files-found: warn
          retention-days: 30
