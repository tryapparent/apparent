name: Platform verification

on:
  workflow_call:
    inputs:
      plan:
        description: Audited complete PR delta; empty or invalid means full verification
        type: string
        default: ''
      portable:
        description: Manual callers retain full portable checks; automatic CI runs these once
        type: boolean
        default: true
      runner:
        required: true
        type: string
      mac_rust:
        description: Run Mac root and Engine native verification (PR renderer exemption only)
        type: boolean
        default: true
      release_receipt:
        description: Emit the existing manual publication receipt on eligible refs
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      root: ${{ steps.plan.outputs.root }}
      engine: ${{ steps.plan.outputs.engine }}
      browser: ${{ steps.plan.outputs.browser }}
      desktop: ${{ steps.plan.outputs.desktop }}
      client: ${{ steps.plan.outputs.client }}
      foreground: ${{ steps.plan.outputs.foreground }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare hosted Ubuntu package transport
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-apt
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - id: plan
        env:
          VERIFICATION_PLAN: ${{ inputs.plan }}
        run: node --experimental-strip-types enablement/ci/routing/run.ts --outputs
      - uses: actions/setup-python@v5
        if: inputs.portable
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        if: inputs.portable
        with:
          bun-version: '1.3.10'
      - uses: browser-actions/setup-chrome@v1
        if: inputs.portable
        id: chrome
        with:
          chrome-version: stable
      - name: Install recipient media fixture dependency
        if: inputs.portable
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install disk-image contract dependency (no KVM required)
        if: inputs.portable
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils
      - name: Install OCR preprocessing dependency
        if: inputs.portable
        run: python3 -m pip install Pillow
      - name: Manual full portable verification
        if: inputs.portable
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          python3 enablement/verification.py --base unknown --pr
          node --experimental-strip-types enablement/ci/routing/run.ts --portable

  desktop-ui:
    needs: select
    # Each caller verifies one platform independently.
    if: (inputs.runner != 'macos-15-intel' || inputs.release_receipt) && needs.select.outputs.desktop == 'true'
    name: desktop-ui (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: capture/desktop/ui/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare hosted Ubuntu package transport
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-apt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: capture/desktop/ui/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Prepare Electron before timed renderer tests
        run: node node_modules/electron/install.js
      - name: Linux Electron dependencies and sandbox
        if: runner.os == 'Linux'
        run: |
          # Notes smoke verifies native mapped/unmapped windows with xwininfo.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends x11-utils
          npx --no-install playwright install-deps chromium
          # The controls smoke keeps Chromium's sandbox enabled. Configure the
          # locked Electron helper on this disposable runner, not user desktops.
          test -f node_modules/electron/dist/chrome-sandbox
          test ! -L node_modules/electron/dist/chrome-sandbox
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          test "$(stat -c '%u:%g:%a' node_modules/electron/dist/chrome-sandbox)" = 0:0:4755
      - name: Shared Desktop policy checks on Linux
        if: runner.os == 'Linux'
        run: npm test
      - name: Electron bridge and renderer smoke (synthetic socket, not native acceptance)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a npm run test:electron
      - name: Mac Electron platform checks
        if: runner.os == 'macOS'
        run: npm run test:electron:mac

  connect-client:
    needs: select
    if: (inputs.runner != 'macos-15-intel' || inputs.release_receipt) && needs.select.outputs.client == 'true'
    name: connect-client (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Normalize the disposable Intel Mac compiler inventory
        if: runner.os == 'macOS'
        uses: ./.github/actions/mac-rust-cache
      - uses: Swatinem/rust-cache@v2
        with:
          # Isolate this complete client seed from the root/Engine cache.
          key: connect-client
          workspaces: connect/client -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare the client-owned TypeScript policy for native consumers
        run: python3 enablement/verification.py --base unknown --prepare-connect-typescript
      - name: Independent Connect client build and tests
        id: client
        shell: bash
        env:
          APPARENT_TIMING_FILE: ${{ runner.temp }}/client-verification-timings.jsonl
        run: |
          verification_tmp="$(mktemp -d "$HOME/.apparent-client.XXXXXX")"
          readonly verification_tmp
          export TMPDIR="$verification_tmp"
          cleanup() {
            local status=$?
            if ! rm -rf -- "$verification_tmp"; then
              echo '::error::Could not remove the owned client temporary tree' >&2
              if [ "$status" -eq 0 ]; then status=1; fi
            fi
            exit "$status"
          }
          trap cleanup EXIT
          node --experimental-strip-types enablement/timing/command.ts client-compilation cargo build --manifest-path connect/client/Cargo.toml --locked --timings
          node --experimental-strip-types enablement/timing/command.ts client-test-compilation cargo test --manifest-path connect/client/Cargo.toml --locked --timings --no-run
          node --experimental-strip-types enablement/timing/command.ts client-test-execution cargo test --manifest-path connect/client/Cargo.toml --locked --timings -- --test-threads=2
      - name: Retain independent client timings
        if: always() && steps.client.outcome != 'skipped' && steps.client.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: client-verification-timings-${{ inputs.runner }}
          path: |
            ${{ runner.temp }}/client-verification-timings.jsonl
            connect/client/target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7

  rust:
    needs: select
    if: >-
      needs.select.outputs.root == 'true' || needs.select.outputs.engine == 'true' ||
      (inputs.runner == 'macos-15-intel' && !inputs.release_receipt &&
      (needs.select.outputs.desktop == 'true' || needs.select.outputs.client == 'true'))
    name: ${{ inputs.runner == 'macos-15-intel' && !inputs.release_receipt && 'platform' || 'rust' }} (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      candidate_id: ${{ steps.candidate_upload.outputs.artifact-id }}
      candidate_digest: ${{ steps.candidate_upload.outputs.artifact-digest }}
      candidate_attempt: ${{ steps.candidate_identity.outputs.attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare hosted Ubuntu package transport
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-apt
      - name: Linux application dependencies
        if: runner.os == 'Linux' && needs.select.outputs.root == 'true'
        run: ./capture/desktop/scripts/linux/appimage/dependencies.sh
      - name: Select the macOS 26 SDK required by native helpers
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Pin selected Xcode for native builds
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        shell: bash
        run: |
          selected="$(env -u DEVELOPER_DIR /usr/bin/xcode-select -p)"
          selected="$(cd "$selected" && pwd -P)"
          printf 'DEVELOPER_DIR=%s\n' "$selected" >> "$GITHUB_ENV"
      - name: Install CLI export speedup dependencies
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        run: command -v ffmpeg && command -v ffprobe || brew install ffmpeg
      - name: Install the Metal toolchain
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Verify Mac installer replacement transactions
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        run: |
          xcrun swiftc -D INSTALLER_TEST -parse-as-library capture/desktop/native/installer/Installer.swift capture/desktop/native/installer/InstallerTests.swift -o "$RUNNER_TEMP/installer-transaction-tests"
          "$RUNNER_TEMP/installer-transaction-tests"
      - uses: dtolnay/rust-toolchain@stable
        if: needs.select.outputs.root == 'true' || needs.select.outputs.engine == 'true' || needs.select.outputs.client == 'true'
        with:
          # Keep both platforms on the validated native build-output layout.
          toolchain: '1.99.1'
      - name: Normalize the disposable Intel Mac compiler inventory
        if: runner.os == 'macOS' && (needs.select.outputs.root == 'true' || needs.select.outputs.engine == 'true' || needs.select.outputs.client == 'true')
        uses: ./.github/actions/mac-rust-cache
      - uses: Swatinem/rust-cache@v2
        if: needs.select.outputs.root == 'true' || needs.select.outputs.engine == 'true'
        with:
          # Cache versions include the entire path inventory. Retain the client
          # path even when its execution moves to an independently required job.
          workspaces: |
            . -> target
            capture/engine -> target
            connect/client -> target
      - uses: Swatinem/rust-cache@v2
        if: inputs.runner == 'macos-15-intel' && !inputs.release_receipt && needs.select.outputs.client == 'true' && needs.select.outputs.root != 'true' && needs.select.outputs.engine != 'true'
        with:
          key: connect-client
          workspaces: connect/client -> target
      - uses: actions/setup-node@v4
        if: inputs.runner == 'macos-15-intel' || needs.select.outputs.root == 'true' || needs.select.outputs.engine == 'true' || needs.select.outputs.browser == 'true'
        with:
          node-version: ${{ runner.os == 'macOS' && '22.23.0' || '22' }}
      - name: Reject an inconsistent Mac native exemption
        if: inputs.runner == 'macos-15-intel' && !inputs.mac_rust && !inputs.release_receipt
        env:
          VERIFICATION_PLAN: ${{ inputs.plan }}
        run: |
          node --experimental-strip-types --input-type=module -e '
            import {parsePlan} from "./enablement/ci/routing/run.ts";
            const plan = parsePlan(process.env.VERIFICATION_PLAN);
            if (plan.root || plan.engine) throw Error("Mac exemption must use the authoritative native-free plan");
          '
      - name: Timing helper contracts
        id: timing
        run: |
          node --experimental-strip-types --test enablement/timing/command.test.ts
          node --experimental-strip-types --test enablement/timing/mac-cache.test.ts
          echo "APPARENT_TIMING_FILE=$RUNNER_TEMP/verification-timings.jsonl" >> "$GITHUB_ENV"
          touch "$RUNNER_TEMP/verification-timings.jsonl"
      - name: Agent setup policy and native metadata contracts (no Rust required)
        if: needs.select.outputs.root == 'true'
        env:
          APPARENT_SETUP_NATIVE_FIXTURE: '1'
        run: node --test capture/agent/setup/*.test.ts
      - name: Local Desktop install reuse contracts
        if: runner.os == 'macOS' && (needs.select.outputs.root == 'true' || needs.select.outputs.engine == 'true' || needs.select.outputs.desktop == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node --experimental-strip-types enablement/local-tests/run.ts --base "$BASE_SHA" --head HEAD --desktop-install-contracts --conservative-workflows --run
      - name: Prepare private temporary root before first Cargo
        if: needs.select.outputs.root == 'true' || needs.select.outputs.engine == 'true'
        shell: bash
        run: |
          verification_tmp="$(mktemp -d "$HOME/.apparent-prerequisites.XXXXXX")"
          echo "APPARENT_PREREQUISITE_TMP=$verification_tmp" >> "$GITHUB_ENV"
          echo "TMPDIR=$verification_tmp" >> "$GITHUB_ENV"
          TMPDIR="$verification_tmp" python3 enablement/verification.py --base unknown --preflight
      - name: Cache Electron downloads (not installed modules or test receipts)
        if: needs.select.outputs.root == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/electron-downloads
          key: electron-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('capture/desktop/ui/frontend/package-lock.json') }}
      - name: Prepare locked native prerequisites before first Cargo
        if: needs.select.outputs.root == 'true'
        timeout-minutes: 5
        env:
          electron_config_cache: ${{ runner.temp }}/electron-downloads
        run: |
          npm --prefix capture/desktop/ui/frontend ci --no-audit --no-fund
          node capture/desktop/ui/frontend/node_modules/electron/install.js
          node --experimental-strip-types enablement/prerequisites/native.ts
          # Later clean packaging installs must use the archive prepared here.
          printf 'electron_config_cache=%s\n' "$electron_config_cache" >> "$GITHUB_ENV"
          # Installation-contract evidence keeps its original environment. Only
          # later Cargo/native source checks suppress optional index refreshes.
          printf 'GIT_OPTIONAL_LOCKS=0\n' >> "$GITHUB_ENV"
      - name: Install Mac renderer dependencies when native preparation did not install them
        if: inputs.runner == 'macos-15-intel' && !inputs.release_receipt && needs.select.outputs.desktop == 'true' && needs.select.outputs.root != 'true'
        working-directory: capture/desktop/ui/frontend
        run: npm ci --no-audit --no-fund
      - name: Prepare Mac Electron before timed renderer tests
        if: inputs.runner == 'macos-15-intel' && !inputs.release_receipt && needs.select.outputs.desktop == 'true'
        working-directory: capture/desktop/ui/frontend
        run: node node_modules/electron/install.js
      - name: Mac Electron platform checks
        if: inputs.runner == 'macos-15-intel' && !inputs.release_receipt && needs.select.outputs.desktop == 'true'
        timeout-minutes: 15
        working-directory: capture/desktop/ui/frontend
        run: npm run test:electron:mac
      - name: Qualify Record media through the published Engine provider
        if: needs.select.outputs.root == 'true'
        run: npm --prefix record/media run test:native
      - name: Qualify Agent frames through the published Engine provider
        if: needs.select.outputs.root == 'true'
        run: npm --prefix capture/agent/media run test:native
      # This uses real Git/Cargo with a dependency-free fixture, not Darwin APIs.
      # Keep the native app and Electron/Rust integration checks on each OS.
      - name: Portable Cargo source-identity freshness regression
        if: runner.os == 'Linux' && needs.select.outputs.root == 'true'
        env:
          APPARENT_CARGO_INDEX_FIXTURE: '1'
        run: node --experimental-strip-types --test enablement/prerequisites/source-identity/git-index.test.ts
      - name: CI-sensitive fixtures before native checks
        if: needs.select.outputs.root == 'true'
        shell: bash
        run: |
          # Reproduce the CI-sensitive fixtures before the full affected suites.
          if [ "${{ needs.select.outputs.root }}" = true ]; then
            if [ "$RUNNER_OS" = macOS ]; then
              # libtest ORs positional filters. Compile/check freshness once for
              # all four current cases; the later unfiltered suite still runs.
              cargo test -j 3 --locked --timings -- --test-threads=2 \
                capture::desktop::settings::settings::tests::the_command_line_row_ \
                capture::desktop::workflow::agent_capture::tests::competing_launches_cannot_remove_the_winning_control_socket \
                connect::hosted::hosted_tests::hosted_security_darwin_acl_grants_fail_closed
            else
              # Batch Linux's three cases too: one Cargo freshness traversal.
              cargo test -j 3 --locked --timings -- --test-threads=2 \
                capture::desktop::settings::settings::tests::the_command_line_row_ \
                capture::desktop::workflow::agent_capture::tests::competing_launches_cannot_remove_the_winning_control_socket
            fi
          fi
      # Required app compilation precedes GUI assertions; the later full verifier
      # still executes its unchanged build/test inventory against this target.
      - name: Build and package the exact Mac candidate for native checks
        id: mac_candidate_build
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        shell: bash
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          export APPARENT_APP_DIR="$HOME/Applications/Apparent-Storage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.app"
          test ! -e "$APPARENT_APP_DIR"
          APPARENT_NO_LAUNCH=1 node --experimental-strip-types enablement/timing/command.ts packaging bash capture/desktop/scripts/packaging/install-app.sh
          codesign --verify --deep --strict "$APPARENT_APP_DIR"
          node --experimental-strip-types record/media/test/package.ts --binary "$APPARENT_APP_DIR/Contents/MacOS/apparent" --settings "$APPARENT_APP_DIR/Contents/Resources/settings"
          node --experimental-strip-types capture/agent/media/test/package.ts --binary "$APPARENT_APP_DIR/Contents/MacOS/apparent" --settings "$APPARENT_APP_DIR/Contents/Resources/settings"
      - name: Retain the installed Mac CI candidate for a separate native test run
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        shell: bash
        run: |
          node --experimental-strip-types --test capture/desktop/scripts/packaging/native-candidate.test.ts
          node --experimental-strip-types capture/desktop/scripts/packaging/native-candidate.ts --retain-installed
      - name: Upload the pending native test candidate
        id: candidate_upload
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apparent-native-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apparent-native-candidate/*
          if-no-files-found: error
          retention-days: 2
      - id: candidate_identity
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Early Mac Electron to Rust Settings integration (not native GUI proof)
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        shell: bash
        run: |
          # Installation/download and executable readiness passed before Cargo.
          if [ "$RUNNER_OS" = macOS ]; then
            electron="$PWD/capture/desktop/ui/frontend/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron"
          else
            electron="$PWD/capture/desktop/ui/frontend/node_modules/electron/dist/electron"
          fi
          test -x "$electron"
          storage_tmp="$(mktemp -d "$HOME/.apparent-storage.XXXXXX")"
          readonly storage_tmp
          trap 'rm -rf -- "$storage_tmp"' EXIT
          TMPDIR="$storage_tmp" APPARENT_STORAGE_TEST_ELECTRON="$electron" \
            APPARENT_CONNECT_TEST_ELECTRON="$electron" \
            node --experimental-strip-types enablement/timing/command.ts bridge-readiness-and-assertions cargo test -j 3 --locked --timings _electron_rust_roundtrip -- --ignored --nocapture
      - name: Execute the same changed-tree checks (not GUI acceptance)
        if: (needs.select.outputs.root == 'true' || needs.select.outputs.engine == 'true') && (inputs.runner != 'macos-15-intel' || inputs.mac_rust || inputs.release_receipt)
        env:
          VERIFICATION_PLAN: ${{ inputs.plan }}
        run: |
          # Engine finalizer proofs reject group-writable cache ancestors.
          verification_tmp="$(mktemp -d "$HOME/.apparent-verification.XXXXXX")"
          readonly verification_tmp
          export TMPDIR="$verification_tmp"
          cleanup() {
            local status=$?
            if ! rm -rf -- "$verification_tmp"; then
              echo '::error::Could not remove the owned verification temporary tree' >&2
              if [ "$status" -eq 0 ]; then status=1; fi
            fi
            exit "$status"
          }
          trap cleanup EXIT
          node --experimental-strip-types enablement/ci/routing/native.ts
      - name: Actual Electron to Rust Settings integration (not native GUI proof)
        if: runner.os == 'Linux' && needs.select.outputs.root == 'true'
        shell: bash
        run: |
          # Installation/download and executable readiness passed before Cargo.
          if [ "$RUNNER_OS" = macOS ]; then
            electron="$PWD/capture/desktop/ui/frontend/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron"
          else
            electron="$PWD/capture/desktop/ui/frontend/node_modules/electron/dist/electron"
          fi
          test -x "$electron"
          storage_tmp="$(mktemp -d "$HOME/.apparent-storage.XXXXXX")"
          readonly storage_tmp
          trap 'rm -rf -- "$storage_tmp"' EXIT
          TMPDIR="$storage_tmp" APPARENT_STORAGE_TEST_ELECTRON="$electron" \
            APPARENT_CONNECT_TEST_ELECTRON="$electron" \
            node --experimental-strip-types enablement/timing/command.ts bridge-readiness-and-assertions cargo test -j 3 --locked --timings _electron_rust_roundtrip -- --ignored --nocapture
      - name: Prepare the client-owned TypeScript policy for native consumers
        if: inputs.runner == 'macos-15-intel' && !inputs.release_receipt && needs.select.outputs.client == 'true'
        run: python3 enablement/verification.py --base unknown --prepare-connect-typescript
      - name: Independent Connect client build and tests
        if: inputs.runner == 'macos-15-intel' && !inputs.release_receipt && needs.select.outputs.client == 'true'
        id: client
        timeout-minutes: 20
        shell: bash
        env:
          APPARENT_TIMING_FILE: ${{ runner.temp }}/client-verification-timings.jsonl
        run: |
          verification_tmp="$(mktemp -d "$HOME/.apparent-client.XXXXXX")"
          readonly verification_tmp
          export TMPDIR="$verification_tmp"
          cleanup() {
            local status=$?
            if ! rm -rf -- "$verification_tmp"; then
              echo '::error::Could not remove the owned client temporary tree' >&2
              if [ "$status" -eq 0 ]; then status=1; fi
            fi
            exit "$status"
          }
          trap cleanup EXIT
          node --experimental-strip-types enablement/timing/command.ts client-compilation cargo build --manifest-path connect/client/Cargo.toml --locked --timings
          node --experimental-strip-types enablement/timing/command.ts client-test-compilation cargo test --manifest-path connect/client/Cargo.toml --locked --timings --no-run
          node --experimental-strip-types enablement/timing/command.ts client-test-execution cargo test --manifest-path connect/client/Cargo.toml --locked --timings -- --test-threads=2
      - name: Retain independent client timings
        if: always() && inputs.runner == 'macos-15-intel' && !inputs.release_receipt && needs.select.outputs.client == 'true' && steps.client.outcome != 'skipped' && steps.client.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: client-verification-timings-${{ inputs.runner }}
          path: |
            ${{ runner.temp }}/client-verification-timings.jsonl
            connect/client/target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7
      - name: Retain completed Mac dependency seeds after full verification
        if: runner.os == 'macOS' && (needs.select.outputs.root == 'true' || needs.select.outputs.engine == 'true')
        # Arm only after ALL selected suites, including the packed client lane.
        # Branch cache access and the existing complete-seed policy stay intact.
        run: echo 'CACHE_ON_FAILURE=true' >> "$GITHUB_ENV"
      - name: Clean private prerequisite temporary root
        if: always()
        shell: bash
        run: |
          if [ -n "${APPARENT_PREREQUISITE_TMP:-}" ]; then
            rm -rf -- "$APPARENT_PREREQUISITE_TMP"
          fi

      - name: Retain observation-only timings, including failures
        if: always() && steps.timing.outcome != 'skipped' && steps.timing.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: verification-timings-${{ inputs.runner }}
          path: |
            ${{ runner.temp }}/verification-timings.jsonl
            target/cargo-timings/*.html
            capture/engine/target/cargo-timings/*.html
            connect/client/target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7

  native-acceptance:
    name: Native acceptance (macos-15-intel)
    needs: [select, rust]
    if: inputs.runner == 'macos-15-intel' && needs.select.outputs.root == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Select the macOS 26 SDK required by native helpers
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Install native test driver dependencies
        run: |
          npm --prefix capture/desktop/ui/frontend ci --no-audit --no-fund
          node capture/desktop/ui/frontend/node_modules/electron/install.js
          # reference-native launches the source Electron driver, whose emitted
          # renderer/policy inputs are not supplied by npm ci. Never rebuild the app.
          npm --prefix capture/desktop/ui/frontend run build
          command -v ffmpeg && command -v ffprobe || brew install ffmpeg
      - name: Authenticate and install the exact retained candidate
        id: install
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ID: ${{ needs.rust.outputs.candidate_id }}
          CANDIDATE_DIGEST: ${{ needs.rust.outputs.candidate_digest }}
          CANDIDATE_ATTEMPT: ${{ needs.rust.outputs.candidate_attempt }}
        run: node --experimental-strip-types capture/desktop/enablement/native-candidate/restore.ts
      - name: Native Mac Storage and error-reporting controls against the installed Rust GUI
        id: native_storage
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        timeout-minutes: 10
        shell: bash
        env:
          APPARENT_STORAGE_NATIVE_CI: '1'
          APPARENT_STORAGE_NATIVE_OUTPUT: ${{ runner.temp }}/apparent-storage-native
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          export APPARENT_APP_DIR="$HOME/Applications/Apparent-Storage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.app"
          APPARENT_STORAGE_NATIVE_APP_DIR="$APPARENT_APP_DIR" \
            node --experimental-strip-types enablement/timing/command.ts native-storage-assertions node --test capture/desktop/ui/frontend/tests/mac-storage-native.cjs
      - name: Native GPUI Copy capture ID against the same installed App
        id: native_copy_id
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        timeout-minutes: 4
        shell: bash
        env:
          APPARENT_COPY_ID_NATIVE_CI: '1'
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          app="$HOME/Applications/Apparent-Storage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.app"
          evidence="$RUNNER_TEMP/apparent-copy-id-native"
          test ! -e "$evidence"
          # Keep compiler diagnostics even when native compilation fails. The
          # fixture itself creates its fresh private evidence subdirectory.
          mkdir -m 700 "$evidence"
          swiftc capture/desktop/scripts/native/copy-capture-id.swift \
            -o "$evidence/copy-capture-id" > "$evidence/compile.log" 2>&1
          node --experimental-strip-types enablement/timing/command.ts native-copy-assertions "$evidence/copy-capture-id" "$app" "$evidence/run"
      - name: Native Electron selected-reference control against the installed Rust App
        id: native_reference
        if: runner.os == 'macOS' && needs.select.outputs.root == 'true'
        timeout-minutes: 4
        shell: bash
        env:
          APPARENT_REFERENCE_OUTPUT: ${{ runner.temp }}/apparent-reference-electron
        run: |
          export APPARENT_REFERENCE_BINARY="$HOME/Applications/Apparent-Storage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.app/Contents/MacOS/apparent"
          node --experimental-strip-types enablement/timing/command.ts native-reference-assertions node --test capture/desktop/ui/frontend/tests/reference-native.cjs
      - name: Installed Mac foreground capture and sharing
        id: native_foreground
        if: >-
          !cancelled() && runner.os == 'macOS' && needs.select.outputs.root == 'true' &&
          (needs.select.outputs.desktop == 'true' || needs.select.outputs.client == 'true' || needs.select.outputs.foreground == 'true') &&
          steps.install.outcome == 'success'
        timeout-minutes: 6
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/apparent-foreground-native"
          test ! -e "$evidence"
          mkdir -m 700 "$evidence"
          swiftc capture/desktop/scripts/native/foreground/pill-input.swift \
            -o "$evidence/pill-input" > "$evidence/pill-input-compile.log" 2>&1
          swiftc capture/desktop/scripts/native/foreground/scene.swift \
            -o "$evidence/scene" > "$evidence/scene-compile.log" 2>&1
          APPARENT_FOREGROUND_NATIVE_OUTPUT="$evidence" \
          APPARENT_FOREGROUND_NATIVE_INPUT="$evidence/pill-input" \
          APPARENT_FOREGROUND_SCENE="$evidence/scene" \
            node --experimental-strip-types capture/desktop/ui/frontend/tests/foreground/mac.ts
      - name: Retain installed Mac foreground evidence
        if: always() && runner.os == 'macOS' && steps.native_foreground.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: mac-foreground-native-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/apparent-foreground-native/**/*.json
            ${{ runner.temp }}/apparent-foreground-native/**/*.png
            ${{ runner.temp }}/apparent-foreground-native/**/*.log
            ${{ runner.temp }}/apparent-foreground-native/**/summary.md
            ${{ runner.temp }}/apparent-foreground-native/**/*.mp4
            ${{ runner.temp }}/apparent-foreground-native/**/*.mov
          if-no-files-found: error
          retention-days: 2
      - name: Retain synthetic Electron reference evidence, including failures
        if: always() && runner.os == 'macOS' && needs.select.outputs.root == 'true' && steps.native_reference.outcome != 'skipped' && steps.native_reference.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: mac-reference-electron-native-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/apparent-reference-electron/*.json
            ${{ runner.temp }}/apparent-reference-electron/*.png
            ${{ runner.temp }}/apparent-reference-electron/*.log
          if-no-files-found: error
          retention-days: 7
      - name: Retain synthetic native Copy capture ID evidence, including failures
        if: always() && runner.os == 'macOS' && needs.select.outputs.root == 'true' && steps.native_copy_id.outcome != 'skipped' && steps.native_copy_id.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: mac-copy-capture-id-native-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/apparent-copy-id-native/**/*.json
            ${{ runner.temp }}/apparent-copy-id-native/**/*.png
            ${{ runner.temp }}/apparent-copy-id-native/**/*.log
            ${{ runner.temp }}/apparent-copy-id-native/compile.log
          if-no-files-found: error
          retention-days: 7
      - name: Retain synthetic Mac Storage evidence, including failures
        if: always() && runner.os == 'macOS' && needs.select.outputs.root == 'true' && steps.native_storage.outcome != 'skipped' && steps.native_storage.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: mac-storage-native-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/apparent-storage-native/*.json
            ${{ runner.temp }}/apparent-storage-native/*.png
            ${{ runner.temp }}/apparent-storage-native/*.log
          if-no-files-found: error
          retention-days: 7
      - name: Retain native acquisition and assertion timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-acceptance-timings-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-acceptance-timings.jsonl
          if-no-files-found: warn
          retention-days: 7

  release-ready:
    name: Release verification
    needs: [select, desktop-ui, connect-client, rust, native-acceptance]
    if: >-
      !cancelled() && needs.select.result == 'success' &&
      (needs['desktop-ui'].result == 'success' || needs['desktop-ui'].result == 'skipped') &&
      (needs['connect-client'].result == 'success' || needs['connect-client'].result == 'skipped') &&
      (needs.rust.result == 'success' || needs.rust.result == 'skipped') &&
      ((inputs.runner == 'macos-15-intel' && needs.select.outputs.root == 'true' && needs['native-acceptance'].result == 'success') ||
       ((inputs.runner != 'macos-15-intel' || needs.select.outputs.root != 'true') && needs['native-acceptance'].result == 'skipped')) &&
      inputs.release_receipt && (github.ref == 'refs/heads/main' || (github.repository == 'tryapparent/apparent' && github.ref == 'refs/heads/t3/onboarding-mac-release-baseline' && github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Platform checks passed for $GITHUB_SHA"
