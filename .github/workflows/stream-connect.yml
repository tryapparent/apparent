name: Connect continuous delivery

on:
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!capture/**"
      - "!record/**"
      - "!agent/**"
      - "!connect/**"
      - "!public/**"
      - "!hermes/**"
      - "!enablement/**"
      - "!shared/**"
      - "!composition/**"
      - "!.cargo/**"
      - "!.github/**"
      - "!.githooks/**"
      - "!engine/**"
      - "!AGENTS.md"
      - "!README.md"
      - "!Cargo.toml"
      - "!Cargo.lock"
      - "!build.rs"
      - "!main.rs"
      - "shared/**"
      - "composition/**"
      - "enablement/**"
      - ".github/**"
      - ".githooks/**"
      - "!.github/workflows/stream-engine.yml"
      - "!.github/workflows/stream-agent.yml"
      - "!.github/workflows/hermes.yml"
      - "!.github/workflows/stream-public.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "main.rs"
      - ".cargo/**"
      - ".github/workflows/verification-platform.yml"
      - "enablement/verification.py"
      - "enablement/prerequisites/**"
      - "enablement/local-tests/**"
      - "enablement/native-build/**"
      - "capture/desktop/scripts/packaging/install-app.sh"
      - "capture/desktop/scripts/packaging/frontend/stage.ts"
      - "connect/**"
      - "public/**"
      - ".github/workflows/stream-connect.yml"
      - "enablement/release_gate.py"
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
    paths:
      - "**"
      - "!capture/**"
      - "!record/**"
      - "!agent/**"
      - "!connect/**"
      - "!public/**"
      - "!hermes/**"
      - "!enablement/**"
      - "!shared/**"
      - "!composition/**"
      - "!.cargo/**"
      - "!.github/**"
      - "!.githooks/**"
      - "!engine/**"
      - "!AGENTS.md"
      - "!README.md"
      - "!Cargo.toml"
      - "!Cargo.lock"
      - "!build.rs"
      - "!main.rs"
      - "shared/**"
      - "composition/**"
      - "enablement/**"
      - ".github/**"
      - ".githooks/**"
      - "!.github/workflows/stream-engine.yml"
      - "!.github/workflows/stream-agent.yml"
      - "!.github/workflows/hermes.yml"
      - "!.github/workflows/stream-public.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "main.rs"
      - ".cargo/**"
      - ".github/workflows/verification-platform.yml"
      - "enablement/verification.py"
      - "enablement/prerequisites/**"
      - "enablement/local-tests/**"
      - "enablement/native-build/**"
      - "capture/desktop/scripts/packaging/install-app.sh"
      - "capture/desktop/scripts/packaging/frontend/stage.ts"
      - "connect/**"
      - "public/**"
      - ".github/workflows/stream-connect.yml"
      - "enablement/release_gate.py"
  workflow_dispatch:
    inputs:
      macos_diagnostics:
        description: Run optional Mac native integration diagnostics
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: connect-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.paths.outputs.plan }}
      native: ${{ steps.paths.outputs.native }}
      portable: ${{ steps.paths.outputs.portable }}
      publish: ${{ steps.paths.outputs.publish }}
      bend: ${{ steps.paths.outputs.bend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - id: paths
        env:
          # Every affected main candidate verifies the complete Connect tree;
          # irrelevant main advances do not supersede its pending delivery.
          BASE_SHA: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
        run: bun connect/enablement/ci/select.ts --admit

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun test enablement/ci/ connect/enablement/ci/

  portable:
    needs: [select, contracts]
    if: needs.select.outputs.portable != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ubuntu-apt
        if: runner.os == 'Linux'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Verify Connect Bend types and laws with Lean
        if: needs.select.outputs.bend == 'true'
        run: node connect/enablement/ci/bend/check.ts --proof
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Resolve recipient FFmpeg archives
        id: ffmpeg_plan
        run: node --experimental-strip-types connect/enablement/ci/recipient-ffmpeg.ts plan
      - uses: actions/cache/restore@v4
        id: ffmpeg_archives
        if: steps.ffmpeg_plan.outputs.key != ''
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/apparent-recipient-ffmpeg/archives
          key: ${{ steps.ffmpeg_plan.outputs.key }}
          restore-keys: recipient-ffmpeg-noble-amd64-v1-
      - name: Install recipient media fixture dependency
        env:
          RECIPIENT_ARCHIVE_HIT: ${{ steps.ffmpeg_archives.outputs.cache-hit }}
        run: node --experimental-strip-types connect/enablement/ci/recipient-ffmpeg.ts install
      - uses: actions/cache/save@v4
        if: >-
          steps.ffmpeg_plan.outputs.key != '' && steps.ffmpeg_archives.outputs.cache-hit != 'true' &&
          github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/apparent-recipient-ffmpeg/archives
          key: ${{ steps.ffmpeg_plan.outputs.key }}
      - name: Connect service, recipient and browser checks
        env:
          VERIFICATION_PLAN: ${{ needs.select.outputs.plan }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node --experimental-strip-types enablement/ci/routing/run.ts --portable

  linux:
    needs: [select, contracts]
    if: >-
      !cancelled() && needs.select.result == 'success' && needs.contracts.result == 'success' &&
      needs.select.outputs.native == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    uses: ./.github/workflows/verification-platform.yml
    with:
      runner: ubuntu-24.04
      portable: false
      release_receipt: false
      plan: ${{ needs.select.outputs.plan }}

  macos:
    needs: [select, contracts, portable]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.macos_diagnostics == true &&
      !cancelled() && needs.select.result == 'success' && needs.contracts.result == 'success' &&
      (needs.portable.result == 'success' || needs.portable.result == 'skipped') && needs.select.outputs.native == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    uses: ./.github/workflows/verification-platform.yml
    with:
      runner: macos-15-intel
      portable: false
      release_receipt: false
      plan: ${{ needs.select.outputs.plan }}

  admit:
    needs: [select, contracts, portable, linux]
    if: >-
      !cancelled() && github.repository == 'tryapparent/apparent' && github.ref == 'refs/heads/main' &&
      vars.HOSTED_CD_ENABLED == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.select.result == 'success' && needs.contracts.result == 'success' && needs.portable.result == 'success' &&
      needs.select.outputs.publish == 'true' &&
      (needs.select.outputs.native == 'false' || needs.linux.result == 'success')
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      # Admission code comes from trusted main, never an unchecked event SHA.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          VERIFY_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == tryapparent/apparent && "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_WORKFLOW_REF" == tryapparent/apparent/.github/workflows/stream-connect.yml@refs/heads/main ]]
          node --experimental-strip-types enablement/ci/routing/streams.ts connect "$REQUEST_SHA" || exit 0
          echo "sha=$REQUEST_SHA" >> "$GITHUB_OUTPUT"

  verify:
    needs: admit
    if: >-
      !cancelled() && needs.admit.result == 'success' && needs.admit.outputs.sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.admit.outputs.sha }}
      - name: Prepare hosted Ubuntu package transport
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-apt
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: connect/service/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Test publication contracts
        run: python3 -m unittest discover -s public/enablement/cd -p 'test_*.py'
      - name: Install locked website dependencies and browser
        working-directory: public/site
        run: |
          bun install --cwd .. --frozen-lockfile
          ../node_modules/.bin/playwright-core install --with-deps chromium firefox
          echo "CHROME_PATH=$(node --input-type=module -e 'import {chromium} from "playwright-core"; console.log(chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Verify production browser composition
        run: node --experimental-strip-types connect/enablement/ci/verify-composition.ts
      - name: Verify Connect browser behavior across credentialed origins
        working-directory: public/site
        env:
          APPARENT_PUBLIC_SITE: '1'
          VITE_HOSTED_API_ORIGIN: http://127.0.0.1:18809
          HOSTED_TEST_API_ORIGIN: http://127.0.0.1:18809
          COMPOSE_SYNTHETIC_ORIGIN: http://127.0.0.1:18809
          COMPOSE_PUBLIC_INPUT: ${{ runner.temp }}/public-artifact
          SITE_ARTIFACT: dist/synthetic-composition
          TMPDIR: ${{ runner.temp }}
          SITE_EVIDENCE: ${{ runner.temp }}/connect-evidence
        run: |
          (cd ../../connect/web && CONNECT_BUILD_DIR=dist-test npm run build)
          node ../enablement/connect/compose-connect.mjs
          node ../enablement/pages/prepare-pages.mjs
          node ../enablement/site-build/verify-composed.mjs
          npm run test:hosted
      - name: Verify and seal the mounted production gateway
        working-directory: connect/tooling/hosting
        env:
          VITE_HOSTED_API_ORIGIN: https://app.tryapparent.com/connect
          TMPDIR: ${{ runner.temp }}
        run: |
          npm ci --no-audit --no-fund
          npm test
          node --experimental-strip-types scripts/seal.ts "${{ needs.admit.outputs.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: connect-production-${{ needs.admit.outputs.sha }}
          path: connect/tooling/hosting/.output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-connect-evidence
          path: ${{ runner.temp }}/connect-evidence/
          retention-days: 3
          if-no-files-found: ignore

  hosted:
    concurrency:
      group: connect-hosted-production
      cancel-in-progress: false
    needs: [admit, verify]
    if: >-
      !cancelled() && needs.admit.result == 'success' && needs.verify.result == 'success' &&
      needs.admit.outputs.sha != '' && github.repository == 'tryapparent/apparent' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.HOSTED_CD_ENABLED == 'true'
    environment:
      name: hosted-production
      url: https://app.tryapparent.com/connect
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.admit.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: connect/tooling/hosting/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: connect/tooling/hosting
      - uses: actions/download-artifact@v4
        with:
          name: connect-production-${{ needs.admit.outputs.sha }}
          path: connect/tooling/hosting/.output/
      - name: Publish the tested artifact and verify its version, assets and anonymous CORS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          node --experimental-strip-types connect/tooling/hosting/scripts/deploy.ts "${{ needs.admit.outputs.sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-deployment-receipt
          path: connect-service-receipt.json
          if-no-files-found: ignore
