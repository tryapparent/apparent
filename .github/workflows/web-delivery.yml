name: Website and Connect — checks & deploy

on:
  pull_request:
    paths: ['site/**', 'connect/web/**', 'hosted/**', 'assets/brand/**', 'scripts/cd/**', '.github/workflows/web-delivery.yml']
  push:
    branches: [main]
    paths: ['site/**', 'connect/web/**', 'hosted/**', 'assets/brand/**', 'scripts/cd/**', '.github/workflows/web-delivery.yml']
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment halfway through publication. Every publisher also
# checks current main; Actions concurrency is not a FIFO queue.
concurrency:
  group: web-delivery-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: hosted/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Test publication contracts
        run: python3 -m unittest discover -s scripts/cd -p 'test_*.py'
      - name: Verify Worker in local workerd with synthetic accounts
        working-directory: hosted
        run: npm ci && npm test
      - name: Install locked website dependencies and browser
        working-directory: site
        run: |
          bun install --frozen-lockfile
          ./node_modules/.bin/playwright-core install --with-deps chromium
          echo "CHROME_PATH=$(node --input-type=module -e 'import {chromium} from "playwright-core"; console.log(chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Independently build and verify Connect browser package
        working-directory: connect/web
        env:
          VITE_HOSTED_API_ORIGIN: https://hosted.tryapparent.com
          CONNECT_EVIDENCE: ${{ runner.temp }}/connect-package-evidence
        run: bun install --frozen-lockfile && npm test
      - name: Build and test production website package
        working-directory: site
        env:
          APPARENT_PUBLIC_SITE: '1'
          VITE_HOSTED_API_ORIGIN: https://hosted.tryapparent.com
        run: |
          npm run build
          node scripts/package-apparent.mjs
          node --test scripts/test-brand-favicon.mjs scripts/test-github-stars.mjs scripts/test-latest-download.mjs scripts/test-platform-os.mjs scripts/test-public-homepage.mjs scripts/test-video-demo.mjs
          node --test scripts/test-package-text.mjs scripts/test-expected-canonical-packaging.mjs scripts/test-upstream-link-guard.mjs scripts/test-package-feature-grid.mjs scripts/test-og-stage-redirect.mjs scripts/test-og-video-stage-browser.mjs
          cp -a dist-apparent "$RUNNER_TEMP/public-artifact"
          node scripts/compose-connect.mjs
      - name: Reconcile accepted live homepage and prepare Pages-only artifact
        working-directory: site
        run: |
          node --test scripts/test-compose-connect.mjs scripts/test-pages-package.mjs scripts/test-pages-video.mjs scripts/test-pages-video-runtime.mjs
          node scripts/prepare-pages.mjs
          node scripts/verify-composed.mjs
          node scripts/prepare-pages-video.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: website-${{ github.sha }}
          path: site/dist-apparent/
          if-no-files-found: error
          # The checked public demos use .local-media; do not drop their assets.
          include-hidden-files: true
          retention-days: 7
      - name: Verify Connect browser behavior across credentialed origins
        working-directory: site
        env:
          APPARENT_PUBLIC_SITE: '1'
          VITE_HOSTED_API_ORIGIN: http://127.0.0.1:18809
          HOSTED_TEST_API_ORIGIN: http://127.0.0.1:18809
          COMPOSE_SYNTHETIC_ORIGIN: http://127.0.0.1:18809
          COMPOSE_PUBLIC_INPUT: ${{ runner.temp }}/public-artifact
          SITE_ARTIFACT: dist/synthetic-composition
          TMPDIR: ${{ runner.temp }}
          SITE_EVIDENCE: ${{ runner.temp }}/connect-evidence
        run: |
          (cd ../connect/web && CONNECT_BUILD_DIR=dist-test npm run build)
          node scripts/compose-connect.mjs
          node scripts/prepare-pages.mjs
          node scripts/verify-composed.mjs
          npm run test:hosted
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-connect-evidence
          path: ${{ runner.temp }}/connect-evidence/
          retention-days: 3
          if-no-files-found: ignore

  website:
    needs: verify
    if: github.repository == 'tryapparent/apparent' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WEBSITE_CD_ENABLED == 'true'
    environment:
      name: website-production
      url: https://app.tryapparent.com
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: website-${{ github.sha }}
          path: site/dist-apparent
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: hosted/package-lock.json
      - run: npm ci
        working-directory: hosted
      - name: Publish checked main to Cloudflare Pages (never Clanker or the Worker)
        env:
          WEBSITE_PAGES_API_TOKEN: ${{ secrets.WEBSITE_PAGES_API_TOKEN }}
        run: python3 scripts/cd/publish_pages.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-deployment-receipt
          path: website-receipt.json
          if-no-files-found: ignore

  hosted:
    needs: verify
    if: github.repository == 'tryapparent/apparent' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.HOSTED_CD_ENABLED == 'true'
    environment:
      name: hosted-production
      url: https://hosted.tryapparent.com
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      HOSTED_D1_ID: ${{ vars.HOSTED_D1_ID }}
      HOSTED_R2_BUCKET: ${{ vars.HOSTED_R2_BUCKET }}
      HOSTED_GOOGLE_CLIENT_ID: ${{ vars.HOSTED_GOOGLE_CLIENT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: hosted/package-lock.json
      - run: npm ci && npm run build
        working-directory: hosted
      - name: Render approved resource bindings (never apply migrations)
        run: python3 scripts/cd/hosted_config.py
      - name: Deploy current checked main and read back version and anonymous CORS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          cd hosted
          ./node_modules/.bin/wrangler deploy --config wrangler.cd.json --tag "$GITHUB_SHA" --message "GitHub Actions $GITHUB_RUN_ID commit $GITHUB_SHA" --strict --no-autoconfig
          cd ..
          python3 scripts/cd/verify_worker.py "$GITHUB_SHA" > hosted-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-deployment-receipt
          path: hosted-receipt.json
          if-no-files-found: ignore
