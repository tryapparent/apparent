name: Architecture admission

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  architecture:
    name: Architecture boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
      - name: Test the architecture checker
        run: node --experimental-strip-types --test shared/enablement/dependency-policy/test/architecture.test.ts
      - name: Check pull request integration tree
        if: github.event_name == 'pull_request'
        run: node --experimental-strip-types shared/enablement/dependency-policy/guards/architecture.ts HEAD^1 HEAD
      - name: Check changes landed on main
        if: github.event_name == 'push'
        env:
          PREVIOUS_MAIN: ${{ github.event.before }}
        run: node --experimental-strip-types shared/enablement/dependency-policy/guards/architecture.ts "$PREVIOUS_MAIN" HEAD
