name: Verification support

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Continuous delivery
      - Connect continuous delivery
      - Public — checks & deploy
      - continuous delivery hermes
      - Engine · Build and publish media capabilities
    types: [completed]

permissions:
  contents: read

concurrency:
  # Distinct source runs/attempts use distinct groups; only duplicate events serialize.
  group: ${{ github.event_name == 'workflow_run' && format('pr-completion-{0}-{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) || format('changed-tree-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_run' }}

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/verification-platform.yml
    with:
      runner: ubuntu-24.04

  notify:
    name: PR workflow completion
    permissions:
      contents: read
      actions: read
      pull-requests: write
    if: >-
      github.event_name == 'workflow_run' && github.repository == 'tryapparent/apparent' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      # workflow_sha is the trusted default-branch workflow revision, never PR input.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Notify the existing PR comment watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types enablement/ci/completion/notify.ts
