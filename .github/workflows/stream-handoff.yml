name: Handoff

on:
  pull_request:
    branches: [main]
    paths:
      - "handoff/**"
      - "shared/enablement/bend/**"
      - ".github/workflows/stream-handoff.yml"
  push:
    branches: [main]
    paths:
      - "handoff/**"
      - "shared/enablement/bend/**"
      - ".github/workflows/stream-handoff.yml"

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: node handoff/enablement/ci/bend/check.ts --proof
