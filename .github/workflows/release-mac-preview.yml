name: Mac preview release

# The fork's Mac release path: optional Developer ID/notarization, always Sparkle EdDSA.
# Keep its feed separate from Kit's Developer ID signed production appcast.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact Linux-and-Mac verified main SHA (empty selects dispatch commit)
        type: string
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: mac-preview-release
  cancel-in-progress: false

jobs:
  admit:
    if: github.repository == 'tryapparent/apparent' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Verification runtime budget and ownership
        working-directory: ${{ runner.temp }}
        shell: bash
        run: echo '15 minute whole-workflow execution budget (runner queue excluded; parallel jobs count once). Per-job timeout is an additional safeguard. If exceeded, optimize the tests. The agent whose run hits the limit owns optimization and a successful rerun; do not raise or bypass the limit.'
      # Check receipts before allocating a Mac, using trusted current main code.
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Require Linux/shared and Mac verification of this exact main commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: python3 enablement/release_gate.py --platform macos --sha "$REQUEST_SHA"

  preview:
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    needs: admit
    if: github.repository == 'tryapparent/apparent' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    # Temporary Mac release exception; restore after verified delivery.
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ needs.admit.outputs.sha }}
      APPARENT_PREVIEW_NOTARIZE: ${{ vars.MAC_APPLE_SIGNING_ENABLED || 'false' }}
      APPARENT_APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPARENT_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPARENT_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
      APPARENT_NOTARY_ISSUER: ${{ vars.APPLE_NOTARY_ISSUER }}
    steps:
      - name: Verification runtime budget and ownership
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          echo 'Temporary Simon-authorized Mac release execution allowance: 60 minutes. All signing, notarization, native acceptance and exact-source release gates remain required. Restore the allowance after verified release delivery.'
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.admit.outputs.sha }}
          fetch-depth: 0
      - name: Require Linux/shared and Mac verification of this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 enablement/release_gate.py --platform macos --sha "$CANDIDATE_SHA"
      - name: Prepare Developer ID credentials
        if: env.APPARENT_PREVIEW_NOTARIZE == 'true'
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: bash capture/desktop/scripts/release/prepare-mac-signing.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: capture/desktop/ui/frontend/package-lock.json
      - name: Install Desktop renderer dependencies
        run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --prefix capture/desktop/ui/frontend --no-audit --no-fund
      - name: Build source-bound Desktop renderer artifact
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/desktop-renderer"
          record="$RUNNER_TEMP/desktop-renderer-build.json"
          node --experimental-strip-types capture/desktop/ui/frontend/scripts/renderer-artifact.ts build "$destination" > "$record"
          archive=$(jq -er '.artifact' "$record")
          manifest=$(tar -xOzf "$archive" manifest.json)
          source=$(jq -er '.source.gitHead' <<< "$manifest")
          test "$source" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(jq -r '.source.gitDirty' <<< "$manifest")" = false
          test "$(jq -er '.source.inputInventory.sha256' <<< "$manifest")" = "$(jq -er '.sourceInputSha256' "$record")"
          echo "APPARENT_DESKTOP_RENDERER_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "APPARENT_DESKTOP_RENDERER_SHA256=$(jq -er '.archiveSha256' "$record")" >> "$GITHUB_ENV"
          echo "APPARENT_DESKTOP_RENDERER_SOURCE_SHA=$source" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Find the latest retained Mac preview native release inputs
        id: root-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-mac-preview.yml --branch main --status success --limit 100 --json databaseId,headSha --jq '.[] | [.databaseId, .headSha] | @tsv')
          while IFS=$'\t' read -r run_id source_sha; do
            [[ -n "$run_id" && "$source_sha" =~ ^[a-f0-9]{40}$ ]] || continue
            artifact="inspection-preview-root-${source_sha}"
            found=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" | jq -s --arg name "$artifact" '[.[].artifacts[] | select(.name == $name and .expired == false)] | length')
            if [[ "$found" == 1 ]]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
              break
            fi
          done <<< "$runs"
      - uses: actions/download-artifact@v5
        if: steps.root-artifact.outputs.run_id != ''
        with:
          name: ${{ steps.root-artifact.outputs.artifact }}
          run-id: ${{ steps.root-artifact.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/inspection-reuse
      - name: Admit compatible retained Mac preview native inputs
        id: root-reuse
        env:
          GH_TOKEN: ${{ github.token }}
          APPARENT_POSTHOG_TOKEN: ${{ secrets.APPARENT_POSTHOG_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ steps.root-artifact.outputs.run_id }}" ]]; then
            echo 'No retained Mac preview root artifact is available; building the native baseline.'
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bundle="$RUNNER_TEMP/inspection-reuse"
          root="$bundle/root"
          receipt="$root/root-receipt.json"
          inspector="$bundle/inspector.tar.gz"
          if [[ ! -f "$receipt" || ! -f "$inspector" ]]; then
            echo 'Retained Mac preview artifact is incomplete; building a fresh native baseline.'
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          root_sha=$(shasum -a 256 "$receipt" | cut -d ' ' -f 1)
          inspector_sha=$(shasum -a 256 "$inspector" | cut -d ' ' -f 1)
          inspector_source=$(tar -xOzf "$inspector" manifest.json | jq -er '.sourceSha')
          root_source=$(jq -er '.sourceSha' "$receipt")
          if [[ ! "$root_source" =~ ^[a-f0-9]{40}$ || ! "$inspector_source" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Retained Mac component source identity is malformed; compiling a fresh native baseline.'
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh attestation verify "$receipt" --repo tryapparent/apparent \
              --signer-workflow tryapparent/apparent/.github/workflows/release-mac-preview.yml \
              --source-ref refs/heads/main --source-digest "$root_source" \
            || ! gh attestation verify "$inspector" --repo tryapparent/apparent \
              --signer-workflow tryapparent/apparent/.github/workflows/release-mac-preview.yml \
              --source-ref refs/heads/main --source-digest "$inspector_source"; then
            echo 'Retained Mac artifacts lack matching release provenance; compiling a fresh native baseline.'
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          expected_target=aarch64-apple-darwin
          if [[ "$(jq -er '.profile' "$receipt")" != release || "$(jq -er '.target' "$receipt")" != "$expected_target" ]]; then
            echo 'Retained Mac root profile or target differs; compiling a fresh native baseline.'
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rustc_version=$(jq -er '.rustc | split("\\n")[0] | capture("^rustc (?<version>[^ ]+)").version' "$receipt")
          expected_rustc=$(jq -er '.rustc' "$receipt")
          expected_cargo=$(jq -er '.cargo' "$receipt")
          if [[ ! "$rustc_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$(rustc -vV)" != "$expected_rustc" || "$(cargo -V)" != "$expected_cargo" ]]; then
            echo 'Current Mac release toolchain differs from the retained root; compiling a fresh native baseline.'
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -n \
            --arg rootDirectory "$root" --arg rootReceipt "$receipt" --arg rootReceiptSha256 "$root_sha" \
            --arg rootProfile release --arg rootSignerWorkflow tryapparent/apparent/.github/workflows/release-mac-preview.yml \
            --arg inspectorArchive "$inspector" --arg inspectorArchiveSha256 "$inspector_sha" \
            --arg inspectorSourceSha "$inspector_source" \
            --arg inspectorSignerWorkflow tryapparent/apparent/.github/workflows/release-mac-preview.yml \
            '{schema:1, rootDirectory:$rootDirectory, rootReceipt:$rootReceipt, rootReceiptSha256:$rootReceiptSha256,
              rootProfile:$rootProfile, rootSignerWorkflow:$rootSignerWorkflow, inspectorArchive:$inspectorArchive,
              inspectorArchiveSha256:$inspectorArchiveSha256, inspectorSourceSha:$inspectorSourceSha,
              inspectorSignerWorkflow:$inspectorSignerWorkflow}' > "$RUNNER_TEMP/inspection-reuse.json"
          chmod 600 "$RUNNER_TEMP/inspection-reuse.json"
          probe="$RUNNER_TEMP/root-reuse-probe"
          if APPARENT_PREVIEW_BUILD=1 APPARENT_HELPER_BUNDLE_ID=dev.simonvanlaak.apparent.preview.helper \
              APPARENT_POSTHOG_TOKEN="$APPARENT_POSTHOG_TOKEN" APPARENT_INSPECTION_REQUIRED_PROFILE=release \
              node --experimental-strip-types capture/agent/inspection/delivery/composition.ts reuse \
                "$RUNNER_TEMP/inspection-reuse.json" "$probe"; then
            echo "APPARENT_INSPECTION_REUSE=$RUNNER_TEMP/inspection-reuse.json" >> "$GITHUB_ENV"
            echo 'APPARENT_INSPECTION_REQUIRED_PROFILE=release' >> "$GITHUB_ENV"
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Retained native inputs failed release admission; compiling a fresh native baseline.'
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
          fi
          rm -rf "$probe"
      - name: Forbid native rebuild after Mac root reuse
        if: steps.root-reuse.outputs.reuse == 'true'
        shell: bash
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/no-native-rebuild"
          mkdir -p "$guard"
          for tool in cargo rustc rustup xcodebuild swiftc cmake clang clang++ cc c++ gcc g++ make ninja; do
            cat > "$guard/$tool" <<EOF
          #!/bin/sh
          echo "Unexpected native build command after root reuse: $tool \$*" >&2
          exit 97
          EOF
            chmod 755 "$guard/$tool"
          done
          real_xcrun=$(command -v xcrun)
          cat > "$guard/xcrun" <<EOF
          #!/bin/sh
          case " \$* " in *" metal "*) echo 'Unexpected Metal toolchain invocation after root reuse' >&2; exit 97 ;; esac
          exec "$real_xcrun" "\$@"
          EOF
          chmod 755 "$guard/xcrun"
          real_swift=$(command -v swift)
          cat > "$guard/swift" <<EOF
          #!/bin/sh
          if [ "\$#" = 1 ] && [ "\$1" = capture/desktop/scripts/release/verify-preview-sparkle-key.swift ]; then exec "$real_swift" "\$@"; fi
          echo "Unexpected Swift source compilation after root reuse: swift \$*" >&2
          exit 97
          EOF
          chmod 755 "$guard/swift"
          echo "$guard" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        if: steps.root-reuse.outputs.reuse != 'true'
        with:
          key: mac-preview
          cache-on-failure: true
      - name: Install the Metal toolchain
        if: steps.root-reuse.outputs.reuse != 'true'
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Build and verify the preview app
        env:
          GH_TOKEN: ${{ github.token }}
          APPARENT_APPLE_SIGNING_DIR: ${{ runner.temp }}/apparent-apple-signing
          APPARENT_PREVIEW_VERSION: 0.${{ github.run_number }}.${{ github.run_attempt }}
          APPARENT_PREVIEW_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          APPARENT_PREVIEW_PUBLIC_KEY: ${{ vars.SPARKLE_PREVIEW_PUBLIC_KEY }}
          APPARENT_POSTHOG_TOKEN: ${{ secrets.APPARENT_POSTHOG_TOKEN }}
        run: |
          python3 -m unittest discover -s capture/desktop/scripts/tests -p 'test_preview_*.py'
          bash capture/desktop/scripts/packaging/build-mac-preview.sh
          capture/desktop/scripts/support/check-ca-roots.sh target/release/apparent
          target/release/apparent --help
      - name: Retain preview-root composition inputs
        if: env.CANDIDATE_SHA == github.sha && steps.root-reuse.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APPARENT_POSTHOG_TOKEN: ${{ secrets.APPARENT_POSTHOG_TOKEN }}
          APPARENT_PREVIEW_BUILD: '1'
          APPARENT_HELPER_BUNDLE_ID: dev.simonvanlaak.apparent.preview.helper
        run: node --experimental-strip-types capture/agent/inspection/delivery/composition.ts retain-release target/release 'dist/Apparent Preview.app/Contents/MacOS' "$RUNNER_TEMP/inspection-release"
      - uses: actions/attest-build-provenance@v2
        if: env.CANDIDATE_SHA == github.sha && steps.root-reuse.outputs.reuse != 'true'
        with:
          subject-path: |
            ${{ runner.temp }}/inspection-release/root/root-receipt.json
            ${{ runner.temp }}/inspection-release/inspector.tar.gz
      - uses: actions/upload-artifact@v4
        if: env.CANDIDATE_SHA == github.sha && steps.root-reuse.outputs.reuse != 'true'
        with:
          name: inspection-preview-root-${{ github.sha }}
          path: ${{ runner.temp }}/inspection-release/
          if-no-files-found: error
          retention-days: 14
      - name: Sign the Sparkle archive
        env:
          SPARKLE_PREVIEW_PRIVATE_KEY: ${{ secrets.SPARKLE_PREVIEW_PRIVATE_KEY }}
          SPARKLE_PREVIEW_PUBLIC_KEY: ${{ vars.SPARKLE_PREVIEW_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$SPARKLE_PREVIEW_PRIVATE_KEY" || { echo 'Missing preview Sparkle signing secret' >&2; exit 1; }
          swift capture/desktop/scripts/release/verify-preview-sparkle-key.swift
          version="0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          zip="dist/Apparent-Preview-${version}-arm64.zip"
          # Sparkle reads the key from stdin; do not put it in arguments, logs or the checkout.
          printf '%s\n' "$SPARKLE_PREVIEW_PRIVATE_KEY" | \
            "$(capture/desktop/scripts/release/setup-sparkle.sh)/bin/sign_update" --ed-key-file - "$zip" \
            > "$RUNNER_TEMP/preview-signature-attributes"
      - name: Publish a uniquely versioned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          tag="preview-mac-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          dmg="dist/Apparent-Preview-${version}-arm64.dmg"
          zip="dist/Apparent-Preview-${version}-arm64.zip"
          # A maintainer may pre-create this exact tag when the workflow token
          # cannot tag a commit that changes .github/workflows. Never overwrite
          # a release or accept a tag pointing at a different commit.
          error="$RUNNER_TEMP/preview-api-error"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>"$error"; then
            echo "Release already exists: ${tag}" >&2
            exit 1
          elif ! grep -qE '\(HTTP 404\)$' "$error"; then
            echo "Could not check whether release ${tag} exists" >&2
            exit 1
          fi
          tag_type=''
          existing_sha=''
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
              --jq '.object.type + " " + .object.sha' > "$RUNNER_TEMP/preview-tag" 2>"$error"; then
            read -r tag_type existing_sha < "$RUNNER_TEMP/preview-tag"
          elif ! grep -qE '\(HTTP 404\)$' "$error"; then
            echo "Could not inspect tag ${tag}" >&2
            exit 1
          fi
          # Only lightweight tags are accepted; annotated tags point at a tag
          # object and need a second dereference, which we deliberately avoid.
          if [[ -n "$existing_sha" && ( "$tag_type" != "commit" || "$existing_sha" != "$CANDIDATE_SHA" ) ]]; then
            echo "Tag ${tag} does not point to the run commit" >&2
            exit 1
          fi
          tag_args=(--target "$CANDIDATE_SHA")
          if [[ -n "$existing_sha" ]]; then tag_args=(--verify-tag); fi
          if [[ "$APPARENT_PREVIEW_NOTARIZE" == true ]]; then
            notes="Mac preview signed with Developer ID and notarized by Apple. Updates use the existing preview Sparkle feed and EdDSA signature. This does not update Kit's app."
          else
            notes="Temporary Mac release. Ad-hoc code signed, not notarized: initial installation may require Privacy & Security → Open Anyway. Later updates use the preview Sparkle feed and EdDSA signature. This does not update Kit's Developer ID signed app."
          fi
          gh release create "$tag" "$dmg" "$dmg.sha256" "$zip" \
            "${tag_args[@]}" \
            --title "Apparent Mac preview ${version}" \
            --notes "$notes" \
            --prerelease --latest=false
      - name: Publish the signed preview appcast after the ZIP is available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          build="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          tag="preview-mac-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          zip="dist/Apparent-Preview-${version}-arm64.zip"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/$(basename "$zip")"
          curl --fail --location --head --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "$url" > /dev/null
          # A moved tag must never become an update offered by the live feed.
          tag_target=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
            --jq '.object.type + " " + .object.sha')
          if [[ "$tag_target" != "commit ${CANDIDATE_SHA}" ]]; then
            echo "Tag moved before appcast publication: ${tag}" >&2
            exit 1
          fi
          branch=preview-mac-feed
          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" > /dev/null 2>&1; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${branch}" -f sha="$CANDIDATE_SHA" > /dev/null
          fi
          previous="$RUNNER_TEMP/previous-preview-appcast.xml"
          printf '' > "$previous"
          sha=''
          if gh api "repos/${GITHUB_REPOSITORY}/contents/appcast.xml?ref=${branch}" > "$RUNNER_TEMP/preview-feed-response.json" 2>"$RUNNER_TEMP/preview-feed-error"; then
            sha=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha"])' "$RUNNER_TEMP/preview-feed-response.json")
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["content"].replace("\n", ""), end="")' \
              "$RUNNER_TEMP/preview-feed-response.json" | base64 -D > "$previous"
          elif ! grep -qE '\(HTTP 404\)$' "$RUNNER_TEMP/preview-feed-error"; then
            echo 'Could not inspect existing Mac feed; refusing publication' >&2
            exit 1
          fi
          # Recheck exact receipts and source ordering while the publisher lock is held.
          python3 enablement/release_gate.py --platform macos --sha "$CANDIDATE_SHA" --previous-mac-feed "$previous"
          python3 capture/desktop/scripts/release/preview_appcast.py \
            --previous "$previous" --zip "$zip" --version "$version" --build-number "$build" \
            --signature-attributes "$(cat "$RUNNER_TEMP/preview-signature-attributes")" \
            --url "$url" --out "$RUNNER_TEMP/preview-appcast.xml"
          fields=(-f branch="$branch" -f message="Publish signed Mac preview $version" \
            -f content="$(base64 < "$RUNNER_TEMP/preview-appcast.xml" | tr -d '\n')")
          if [[ -n "$sha" ]]; then fields+=(-f sha="$sha"); fi
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/appcast.xml" "${fields[@]}" > /dev/null
          gh api "repos/${GITHUB_REPOSITORY}/contents/appcast.xml?ref=${branch}" \
            --jq '.content' | base64 -D | cmp - "$RUNNER_TEMP/preview-appcast.xml"
      - name: Remove Apple signing credentials
        if: always() && env.APPARENT_PREVIEW_NOTARIZE == 'true'
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/apparent-apple-signing"
          trap 'rm -rf "$directory"' EXIT
          keychain="$directory/signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi

  runtime-budget:
    if: always()
    needs: [admit, preview]
    permissions:
      contents: read
      actions: read
    name: Workflow runtime budget
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/runtime-budget
        with:
          platform: macos
