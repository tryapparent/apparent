name: Mac preview release

# The fork's Mac release path: optional Developer ID/notarization, always Sparkle EdDSA.
# Keep its feed separate from Kit's Developer ID signed production appcast.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Already verified main commit to release (defaults to current main)
        required: false
        type: string
      homebrew_tag:
        description: "Publish only the Homebrew cask for an existing Mac release tag (blank builds a new release)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: mac-preview-release
  cancel-in-progress: false

jobs:
  preview:
    if: github.repository == 'tryapparent/apparent' && inputs.homebrew_tag == '' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/t3/onboarding-mac-release-baseline')
    runs-on: macos-latest
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    env:
      RELEASE_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      APPARENT_PREVIEW_NOTARIZE: ${{ vars.MAC_APPLE_SIGNING_ENABLED || 'false' }}
      APPARENT_APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPARENT_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPARENT_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
      APPARENT_NOTARY_ISSUER: ${{ vars.APPLE_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Linux/shared and Mac verification of this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/t3/onboarding-mac-release-baseline ]; then
            test "$RELEASE_SOURCE_SHA" = "$GITHUB_SHA"
            test "$APPARENT_PREVIEW_NOTARIZE" = true
            python3 enablement/release_gate.py --platform macos --sha "$GITHUB_SHA" --onboarding-candidate
            echo 'APPARENT_PREVIEW_VERSION=0.12.2' >> "$GITHUB_ENV"
            echo 'APPARENT_RELEASE_VERSION=0.12.2' >> "$GITHUB_ENV"
            echo 'APPARENT_PREVIEW_BUILD_NUMBER=12.2' >> "$GITHUB_ENV"
            echo 'APPARENT_PREVIEW_TAG=preview-mac-12-2' >> "$GITHUB_ENV"
          else
            python3 enablement/release_gate.py --platform macos --sha "$RELEASE_SOURCE_SHA"
            echo "APPARENT_PREVIEW_BUILD_NUMBER=$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          fi
      # Admission runs from the dispatch ref before any selected source executes.
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          persist-credentials: false
      - name: Resolve version from the admitted source
        id: release
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            node --experimental-strip-types capture/desktop/scripts/release/desktop-version.ts
          fi
          tag=$(sed -n 's/^APPARENT_PREVIEW_TAG=//p' "$GITHUB_ENV" | tail -n 1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$RELEASE_SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Require notarization and tap publication access for regular releases
        if: github.ref == 'refs/heads/main'
        env:
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: |
          test "$APPARENT_PREVIEW_NOTARIZE" = true || { echo 'Regular Mac releases must be notarized for Homebrew.' >&2; exit 1; }
          test -n "$HOMEBREW_TAP_SSH_KEY" || { echo 'Missing tap-only HOMEBREW_TAP_SSH_KEY.' >&2; exit 1; }
      - name: Prepare Developer ID credentials
        if: env.APPARENT_PREVIEW_NOTARIZE == 'true'
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: bash capture/desktop/scripts/release/prepare-mac-signing.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mac-preview
          cache-on-failure: true
      - name: Install the Metal toolchain
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Register PostHog desktop release
        timeout-minutes: 3
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
        run: |
          node --experimental-strip-types --test capture/desktop/scripts/release/desktop-version.test.ts capture/desktop/scripts/release/posthog-release.test.ts
          node --experimental-strip-types capture/desktop/scripts/release/posthog-release.ts macos
      - name: Build and verify the preview app
        env:
          APPARENT_APPLE_SIGNING_DIR: ${{ runner.temp }}/apparent-apple-signing
          APPARENT_PREVIEW_PUBLIC_KEY: ${{ vars.SPARKLE_PREVIEW_PUBLIC_KEY }}
          APPARENT_POSTHOG_TOKEN: ${{ secrets.APPARENT_POSTHOG_TOKEN }}
        run: |
          python3 -m unittest discover -s capture/desktop/scripts/tests -p 'test_preview_*.py'
          bash capture/desktop/scripts/packaging/build-mac-preview.sh
          capture/desktop/scripts/support/check-ca-roots.sh target/release/apparent
          target/release/apparent --help
      - name: Sign the Sparkle archive
        env:
          SPARKLE_PREVIEW_PRIVATE_KEY: ${{ secrets.SPARKLE_PREVIEW_PRIVATE_KEY }}
          SPARKLE_PREVIEW_PUBLIC_KEY: ${{ vars.SPARKLE_PREVIEW_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$SPARKLE_PREVIEW_PRIVATE_KEY" || { echo 'Missing preview Sparkle signing secret' >&2; exit 1; }
          swift capture/desktop/scripts/release/verify-preview-sparkle-key.swift
          version="$APPARENT_PREVIEW_VERSION"
          zip="dist/Apparent-Preview-${version}-arm64.zip"
          # Sparkle reads the key from stdin; do not put it in arguments, logs or the checkout.
          printf '%s\n' "$SPARKLE_PREVIEW_PRIVATE_KEY" | \
            "$(capture/desktop/scripts/release/setup-sparkle.sh)/bin/sign_update" --ed-key-file - "$zip" \
            > "$RUNNER_TEMP/preview-signature-attributes"
      - name: Recheck candidate against live feed before public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api 'repos/tryapparent/apparent/contents/appcast.xml?ref=preview-mac-feed' --jq .content | \
            python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))' > "$RUNNER_TEMP/live-preview-before-release.xml"
          python3 capture/desktop/scripts/release/preview_appcast.py \
            --previous "$RUNNER_TEMP/live-preview-before-release.xml" \
            --zip "dist/Apparent-Preview-${APPARENT_PREVIEW_VERSION}-arm64.zip" \
            --version "$APPARENT_PREVIEW_VERSION" --build-number "$APPARENT_PREVIEW_BUILD_NUMBER" \
            --tag "$APPARENT_PREVIEW_TAG" \
            --signature-attributes "$(cat "$RUNNER_TEMP/preview-signature-attributes")" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${APPARENT_PREVIEW_TAG}/Apparent-Preview-${APPARENT_PREVIEW_VERSION}-arm64.zip" \
            --out "$RUNNER_TEMP/preview-prepublication-check.xml"
      - name: Publish a uniquely versioned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$APPARENT_PREVIEW_VERSION"
          tag="$APPARENT_PREVIEW_TAG"
          dmg="dist/Apparent-Preview-${version}-arm64.dmg"
          zip="dist/Apparent-Preview-${version}-arm64.zip"
          # A maintainer may pre-create this exact tag when the workflow token
          # cannot tag a commit that changes .github/workflows. Never overwrite
          # a release or accept a tag pointing at a different commit.
          error="$RUNNER_TEMP/preview-api-error"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>"$error"; then
            echo "Release already exists: ${tag}" >&2
            exit 1
          elif ! grep -qE '\(HTTP 404\)$' "$error"; then
            echo "Could not check whether release ${tag} exists" >&2
            exit 1
          fi
          tag_type=''
          existing_sha=''
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
              --jq '.object.type + " " + .object.sha' > "$RUNNER_TEMP/preview-tag" 2>"$error"; then
            read -r tag_type existing_sha < "$RUNNER_TEMP/preview-tag"
          elif ! grep -qE '\(HTTP 404\)$' "$error"; then
            echo "Could not inspect tag ${tag}" >&2
            exit 1
          fi
          # Only lightweight tags are accepted; annotated tags point at a tag
          # object and need a second dereference, which we deliberately avoid.
          if [[ -n "$existing_sha" && ( "$tag_type" != "commit" || "$existing_sha" != "$RELEASE_SOURCE_SHA" ) ]]; then
            echo "Tag ${tag} does not point to the run commit" >&2
            exit 1
          fi
          tag_args=(--target "$RELEASE_SOURCE_SHA")
          if [[ -n "$existing_sha" ]]; then tag_args=(--verify-tag); fi
          if [[ "$APPARENT_PREVIEW_NOTARIZE" == true ]]; then
            notes="Mac preview signed with Developer ID and notarized by Apple. Updates use the existing preview Sparkle feed and EdDSA signature. This does not update Kit's app."
          else
            notes="Temporary Mac release. Ad-hoc code signed, not notarized: initial installation may require Privacy & Security → Open Anyway. Later updates use the preview Sparkle feed and EdDSA signature. This does not update Kit's Developer ID signed app."
          fi
          gh release create "$tag" "$dmg" "$dmg.sha256" "$zip" \
            "${tag_args[@]}" \
            --title "Apparent Mac preview ${version}" \
            --notes "$notes" \
            --prerelease --latest=false
      - name: Publish the signed preview appcast after the ZIP is available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$APPARENT_PREVIEW_VERSION"
          build="$APPARENT_PREVIEW_BUILD_NUMBER"
          tag="$APPARENT_PREVIEW_TAG"
          zip="dist/Apparent-Preview-${version}-arm64.zip"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/$(basename "$zip")"
          curl --fail --location --head --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "$url" > /dev/null
          # A moved tag must never become an update offered by the live feed.
          tag_target=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
            --jq '.object.type + " " + .object.sha')
          if [[ "$tag_target" != "commit ${RELEASE_SOURCE_SHA}" ]]; then
            echo "Tag moved before appcast publication: ${tag}" >&2
            exit 1
          fi
          branch=preview-mac-feed
          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" > /dev/null 2>&1; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${branch}" -f sha="$RELEASE_SOURCE_SHA" > /dev/null
          fi
          previous="$RUNNER_TEMP/previous-preview-appcast.xml"
          printf '' > "$previous"
          sha=''
          if gh api "repos/${GITHUB_REPOSITORY}/contents/appcast.xml?ref=${branch}" > "$RUNNER_TEMP/preview-feed-response.json" 2>/dev/null; then
            sha=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha"])' "$RUNNER_TEMP/preview-feed-response.json")
            python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["content"].replace("\n", ""), end="")' \
              "$RUNNER_TEMP/preview-feed-response.json" | base64 -D > "$previous"
          fi
          python3 capture/desktop/scripts/release/preview_appcast.py \
            --previous "$previous" --zip "$zip" --version "$version" --build-number "$build" \
            --tag "$APPARENT_PREVIEW_TAG" \
            --signature-attributes "$(cat "$RUNNER_TEMP/preview-signature-attributes")" \
            --url "$url" --out "$RUNNER_TEMP/preview-appcast.xml"
          fields=(-f branch="$branch" -f message="Publish signed Mac preview $version" \
            -f content="$(base64 < "$RUNNER_TEMP/preview-appcast.xml" | tr -d '\n')")
          if [[ -n "$sha" ]]; then fields+=(-f sha="$sha"); fi
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/appcast.xml" "${fields[@]}" > /dev/null
          gh api "repos/${GITHUB_REPOSITORY}/contents/appcast.xml?ref=${branch}" \
            --jq '.content' | base64 -D | cmp - "$RUNNER_TEMP/preview-appcast.xml"
      - name: Remove Apple signing credentials
        if: always() && env.APPARENT_PREVIEW_NOTARIZE == 'true'
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/apparent-apple-signing"
          trap 'rm -rf "$directory"' EXIT
          keychain="$directory/signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi

  homebrew:
    name: Publish Homebrew cask
    needs: preview
    if: >-
      !cancelled() && github.repository == 'tryapparent/apparent' && github.ref == 'refs/heads/main' &&
      (needs.preview.result == 'success' || (needs.preview.result == 'skipped' && inputs.homebrew_tag != ''))
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      RELEASE_TAG: ${{ needs.preview.outputs.tag || inputs.homebrew_tag }}
      RELEASE_SHA: ${{ needs.preview.outputs.sha }}
      EXPECTED_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the published DMG and prepare the cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --experimental-strip-types --test capture/desktop/scripts/release/homebrew/publish.test.ts
          node --experimental-strip-types capture/desktop/scripts/release/homebrew/publish.ts prepare \
            "$RELEASE_TAG" "$RELEASE_SHA" "$RUNNER_TEMP/apparent.rb"
      - name: Verify Homebrew installation on Apple silicon
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew tap tryapparent/tap
          tap=$(brew --repository tryapparent/tap)
          if [[ -f "$tap/Casks/apparent.rb" ]]; then
            brew install --cask tryapparent/tap/apparent
            cp "$RUNNER_TEMP/apparent.rb" "$tap/Casks/apparent.rb"
            brew upgrade --cask --greedy tryapparent/tap/apparent
          else
            mkdir -p "$tap/Casks"
            cp "$RUNNER_TEMP/apparent.rb" "$tap/Casks/apparent.rb"
            brew install --cask tryapparent/tap/apparent
          fi
          brew style --cask tryapparent/tap/apparent
          app='/Applications/Apparent Preview.app'
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          test -n "$EXPECTED_TEAM_ID"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -Fx "TeamIdentifier=$EXPECTED_TEAM_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" = dev.simonvanlaak.apparent.preview
          version=$(sed -n 's/^  version "\([^"]*\)"$/\1/p' "$RUNNER_TEMP/apparent.rb")
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          "$app/Contents/MacOS/apparent" --version
          brew reinstall --cask tryapparent/tap/apparent
          brew uninstall --cask tryapparent/tap/apparent
          test ! -e "$app"
      # The tap's write credential is available only after download/install checks.
      - uses: actions/checkout@v5
        with:
          repository: tryapparent/homebrew-tap
          ref: main
          path: homebrew-publish
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
      - name: Publish and read back the verified cask
        run: |
          node --experimental-strip-types capture/desktop/scripts/release/homebrew/publish.ts publish \
            "$GITHUB_WORKSPACE/homebrew-publish" "$RUNNER_TEMP/apparent.rb"
