name: Public — checks & deploy

on:
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!capture/**"
      - "!record/**"
      - "!connect/**"
      - "!public/**"
      - "!hermes/**"
      - "!enablement/**"
      - "!shared/**"
      - "!composition/**"
      - "!.cargo/**"
      - "!.github/**"
      - "!.githooks/**"
      - "!engine/**"
      - "!AGENTS.md"
      - "!README.md"
      - "!Cargo.toml"
      - "!Cargo.lock"
      - "!build.rs"
      - "!main.rs"
      - "shared/**"
      - "composition/**"
      - "enablement/**"
      - ".github/**"
      - ".githooks/**"
      - "!.github/workflows/stream-engine.yml"
      - "!.github/workflows/checks.yml"
      - "!.github/workflows/linux-updater-harness.yml"
      - "!.github/workflows/release-linux.yml"
      - "!.github/workflows/release-mac-preview.yml"
      - "!.github/workflows/verification-platform.yml"
      - "!.github/workflows/verification.yml"
      - "!enablement/prerequisites/**"
      - "!enablement/native-build/**"
      - "!enablement/verification.py"
      - "!enablement/build_version.rs"
      - "!.github/workflows/stream-connect.yml"
      - "!.github/workflows/hermes.yml"
      - "public/**"
      - ".github/workflows/stream-public.yml"
      - "README.md"
      - "capture/agent/skills/apparent/SKILL.md"
      - "capture/agent/docs/usage.md"
      - "capture/desktop/docs/guides/recording.md"
      - "capture/engine/docs/guides/processing.md"
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
    paths:
      - "**"
      - "!capture/**"
      - "!record/**"
      - "!connect/**"
      - "!public/**"
      - "!hermes/**"
      - "!enablement/**"
      - "!shared/**"
      - "!composition/**"
      - "!.cargo/**"
      - "!.github/**"
      - "!.githooks/**"
      - "!engine/**"
      - "!AGENTS.md"
      - "!README.md"
      - "!Cargo.toml"
      - "!Cargo.lock"
      - "!build.rs"
      - "!main.rs"
      - "shared/**"
      - "composition/**"
      - "enablement/**"
      - ".github/**"
      - ".githooks/**"
      - "!.github/workflows/stream-engine.yml"
      - "!.github/workflows/checks.yml"
      - "!.github/workflows/linux-updater-harness.yml"
      - "!.github/workflows/release-linux.yml"
      - "!.github/workflows/release-mac-preview.yml"
      - "!.github/workflows/verification-platform.yml"
      - "!.github/workflows/verification.yml"
      - "!enablement/prerequisites/**"
      - "!enablement/native-build/**"
      - "!enablement/verification.py"
      - "!enablement/build_version.rs"
      - "!.github/workflows/stream-connect.yml"
      - "!.github/workflows/hermes.yml"
      - "public/**"
      - ".github/workflows/stream-public.yml"
      - "README.md"
      - "capture/agent/skills/apparent/SKILL.md"
      - "capture/agent/docs/usage.md"
      - "capture/desktop/docs/guides/recording.md"
      - "capture/engine/docs/guides/processing.md"
  workflow_dispatch:

permissions:
  contents: read

# Directory ownership bounds automatic entry. Automatic main and manual
# publication share one noncancelling lock.
concurrency:
  group: public-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      public: ${{ steps.paths.outputs.public }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node --experimental-strip-types enablement/ci/select.ts --admit

  verify:
    needs: select
    # Each affected main candidate checks the complete Public tree. Unrelated
    # main advances leave pending candidates eligible when Public inputs match.
    # Only an explicit successful PR selection may omit Public browser checks.
    if: >-
      !cancelled() && (needs.select.result != 'success' || needs.select.outputs.public != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare hosted Ubuntu package transport
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-apt
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Install Public's locked dependencies and browsers
        working-directory: public/site
        run: |
          bun install --frozen-lockfile
          ./node_modules/.bin/playwright-core install --with-deps chromium firefox
          echo "CHROME_PATH=$(node --input-type=module -e 'import {chromium} from "playwright-core"; console.log(chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Verify Public source, browsers, shared inputs and prepared movie worker
        working-directory: public/site
        env:
          PUBLIC_POSTHOG_TOKEN: ${{ secrets.APPARENT_POSTHOG_TOKEN }}
          PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
          PUBLIC_POSTHOG_ENVIRONMENT: production
        run: npm run verify
      - name: Seal the checked Public-only Pages artifact
        run: node public/site/scripts/cd/publish-pages.ts seal "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: public-${{ github.sha }}
          path: .build/website/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: [select, verify]
    if: needs.select.result == 'success' && github.repository == 'tryapparent/apparent' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.WEBSITE_CD_ENABLED == 'true'
    environment:
      name: website-production
      url: https://app.tryapparent.com
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: public-${{ github.sha }}
          path: .build/website
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
        working-directory: public/site
      - name: Publish sealed current main to Pages and read back both Public origins
        env:
          GH_TOKEN: ${{ github.token }}
          WEBSITE_PAGES_API_TOKEN: ${{ secrets.WEBSITE_PAGES_API_TOKEN }}
        run: node public/site/scripts/cd/publish-pages.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-deployment-receipt
          path: website-receipt.json
          if-no-files-found: ignore
