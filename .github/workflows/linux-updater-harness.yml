name: Linux updater harness

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Harness contracts (not GUI proof)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare hosted Ubuntu package transport
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-apt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disk-image contract dependency (no KVM required)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils
      - name: Install OCR preprocessing dependency
        run: python3 -m pip install Pillow
      - name: Test OCR, release fixture and disposable-runner contracts
        run: node --experimental-strip-types enablement/ci/linux-updater-harness.ts
