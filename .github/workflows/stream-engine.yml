name: Engine · Build and publish media capabilities

on:
  pull_request:
    branches: [main]
    paths:
      - "engine/**"
      - "!engine/permissions/**"
      - "!engine/diagnostics/**"
      - "!engine/recording/model-cache/**"
      - "!engine/native/input/**"
      - "!engine/native/macos/desktop/**"
      - "!engine/**/*.md"
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "!engine/permissions/**"
      - "!engine/diagnostics/**"
      - "!engine/recording/model-cache/**"
      - "!engine/native/input/**"
      - "!engine/native/macos/desktop/**"
      - "!engine/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      selected: ${{ steps.route.outputs.selected }}
      runners: ${{ steps.route.outputs.runners }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Select Engine inputs and event platforms
        id: route
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
        run: bun engine/enablement/ci/run.ts select

  sdk:
    needs: select
    if: needs.select.outputs.selected == 'true'
    runs-on: ubuntu-24.04
    container: node:22.23.0-bookworm-slim
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove packed SDK consumption without native tools or outputs
        run: |
          if command -v cargo || command -v rustc; then exit 1; fi
          node --experimental-strip-types engine/enablement/ci/producer/check.ts --sdk-only --github-env
      - name: Record the qualified SDK digest
        run: node --experimental-strip-types engine/enablement/ci/run.ts sdk-digest "$ENGINE_OUTPUT/artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-sdk
          path: ${{ env.ENGINE_OUTPUT }}/artifacts/apparent-engine-sdk-*
          if-no-files-found: error

  native:
    needs: select
    if: >-
      needs.select.outputs.selected == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.select.outputs.runners) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - uses: ./.github/actions/ubuntu-apt
        if: runner.os == 'Linux' && runner.arch == 'X64'
      - name: Install declared media prerequisites
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
          else
            command -v ffmpeg && command -v ffprobe || brew install ffmpeg
          fi
      - name: Build independent provider and qualify extracted packages
        shell: bash
        run: node --experimental-strip-types engine/enablement/ci/producer/check.ts --github-env
      - uses: actions/upload-artifact@v4
        with:
          name: engine-native-${{ matrix.runner }}
          path: ${{ env.ENGINE_OUTPUT }}/artifacts/engine-media-*
          if-no-files-found: error

  publish:
    needs: [select, sdk, native]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.select.outputs.selected == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Verify that newer main has not changed Engine inputs
        run: |
          git fetch origin main
          bun engine/enablement/ci/run.ts current "$GITHUB_SHA"
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          path: artifacts
          merge-multiple: true
      - name: Require the complete qualified native package inventory
        run: bun engine/enablement/ci/artifacts.ts artifacts "$GITHUB_SHA"
      - name: Publish immutable commit-addressed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd artifacts
          sha256sum -c ./*.sha256
          tag="engine-media-$GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$draft" = false ]; then
              git fetch origin "refs/tags/$tag"
              test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
              proof=$(mktemp -d /tmp/apparent-dev-engine-published-XXXXXX)
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$proof"
              diff -qr . "$proof"
              exit 0
            fi
            test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --draft \
              --title "Engine media $GITHUB_SHA" \
              --notes 'Finite local movie metadata and explicit-time frame providers with a Rust-free SDK. No installed app activation. Pin exact artifact digests; app adoption remains a separate compatibility gate.'
          fi
          # Only the still-unpublished draft may be repaired on a retry.
          gh release upload "$tag" ./* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
