name: Mac verification

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_version:
        description: 'Private candidate version (must be newer than the live feed; does not publish)'
        type: string
        default: '0.12.3'
      candidate_build:
        description: 'Private candidate build number'
        type: string
        default: '12.3'

permissions:
  contents: read

# Coalesce only this platform; a queued Mac must not hold Linux publication.
concurrency:
  group: verification-macos-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verification-platform.yml
    with:
      # General Mac CI can use Intel capacity; arm64 packaging stays on Apple Silicon.
      runner: macos-15-intel

  # Private-to-authenticated-Actions artifact for installed testing. This job has
  # no release/feed write permission and does not produce a release receipt.
  onboarding-candidate:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'tryapparent/apparent' && (github.ref == 'refs/heads/t3/onboarding-mac-release-baseline' || github.ref == 'refs/heads/codex/onboarding-complete-candidate')
    needs: verify
    # Use the stable Apple Silicon pool; latest repeatedly failed runner admission.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      APPARENT_PREVIEW_NOTARIZE: 'true'
      APPARENT_PREVIEW_VERSION: ${{ inputs.candidate_version || '0.12.3' }}
      APPARENT_PREVIEW_BUILD_NUMBER: ${{ inputs.candidate_build || '12.3' }}
      APPARENT_PREVIEW_PUBLIC_KEY: ${{ vars.SPARKLE_PREVIEW_PUBLIC_KEY }}
      APPARENT_APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPARENT_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPARENT_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
      APPARENT_NOTARY_ISSUER: ${{ vars.APPLE_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Refuse a candidate behind the live Preview feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "APPARENT_APPLE_SIGNING_DIR=$RUNNER_TEMP/apparent-apple-signing" >> "$GITHUB_ENV"
          gh api 'repos/tryapparent/apparent/contents/appcast.xml?ref=preview-mac-feed' --jq .content | python3 -c 'import base64, sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))' > "$RUNNER_TEMP/live-preview.xml"
          python3 - "$RUNNER_TEMP/live-preview.xml" <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          version = lambda value: tuple(int(part) for part in value.split('.'))
          namespace = '{http://www.andymatuschak.org/xml-namespaces/sparkle}'
          root = ET.parse(sys.argv[1]).getroot()
          items = root.findall('./channel/item')
          assert items, 'Live Preview feed must contain a version'
          for item in items:
              assert version(os.environ['APPARENT_PREVIEW_BUILD_NUMBER']) > version(item.findtext(namespace + 'version'))
              assert version(os.environ['APPARENT_PREVIEW_VERSION']) > version(item.findtext(namespace + 'shortVersionString'))
          PY
      - name: Prepare existing Preview Developer ID credentials
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: bash capture/desktop/scripts/release/prepare-mac-signing.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mac-preview
          cache-on-failure: true
      - name: Select the required SDK
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Prepare Metal
        run: xcrun --sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Build signed and notarized Preview candidate
        env:
          APPARENT_POSTHOG_TOKEN: ${{ secrets.APPARENT_POSTHOG_TOKEN }}
        run: |
          python3 -m unittest discover -s capture/desktop/scripts/tests -p 'test_preview_*.py'
          xcrun swiftc -D INSTALLER_TEST -parse-as-library capture/desktop/native/installer/Installer.swift capture/desktop/native/installer/InstallerTests.swift -o "$RUNNER_TEMP/installer-transaction-tests"
          "$RUNNER_TEMP/installer-transaction-tests"
          bash capture/desktop/scripts/packaging/build-mac-preview.sh
          capture/desktop/scripts/support/check-ca-roots.sh target/release/apparent
          HELPER=target/release/apparent-helper capture/desktop/scripts/support/check-permission-panel-dock.sh
      - name: Verify candidate identity and record provenance
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib, subprocess
          app = pathlib.Path('dist/Apparent Preview.app')
          info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
          assert info['CFBundleIdentifier'] == 'dev.simonvanlaak.apparent.preview'
          assert info['CFBundleShortVersionString'] == os.environ['APPARENT_PREVIEW_VERSION']
          assert info['CFBundleVersion'] == os.environ['APPARENT_PREVIEW_BUILD_NUMBER']
          assert info['SUPublicEDKey'] == os.environ['APPARENT_PREVIEW_PUBLIC_KEY']
          assert info['SUFeedURL'] == 'https://raw.githubusercontent.com/tryapparent/apparent/preview-mac-feed/appcast.xml'
          resources = app / 'Contents/Resources'
          for name in ['HostGrotesk-Variable.ttf', 'settings/app/dist/onboarding.html', 'settings/app/electron/installer/ui/src/installer/index.html', 'settings/app/electron/onboarding.cjs', 'settings/app/electron/installer/main.cjs', 'settings/app/electron/installer/preload.cjs']:
              assert (resources / name).is_file(), name
          assert 'arm64' in subprocess.check_output(['lipo', '-archs', str(app / 'Contents/MacOS/apparent')], text=True)
          installer = pathlib.Path('dist/Install Apparent.app')
          installer_info = plistlib.loads((installer / 'Contents/Info.plist').read_bytes())
          assert installer_info['CFBundleIdentifier'] == 'dev.simonvanlaak.apparent.preview.installer'
          assert installer_info['CFBundleShortVersionString'] == info['CFBundleShortVersionString']
          assert installer_info['CFBundleVersion'] == info['CFBundleVersion']
          subprocess.run(['codesign', '--verify', '--deep', '--strict', str(installer)], check=True)
          subprocess.run(['xcrun', 'stapler', 'validate', str(installer)], check=True)
          payload = installer / 'Contents/SharedSupport/Apparent Preview.app'
          assert (payload / 'Contents/MacOS/apparent').read_bytes() == (app / 'Contents/MacOS/apparent').read_bytes()
          assets = sorted(pathlib.Path('dist').glob('Apparent-Preview-' + os.environ['APPARENT_PREVIEW_VERSION'] + '-arm64.*'))
          assert {p.suffix for p in assets} >= {'.dmg', '.zip', '.sha256'}
          manifest = {'commit': os.environ['GITHUB_SHA'], 'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                      'version': info['CFBundleShortVersionString'], 'build': info['CFBundleVersion'], 'nativeAcceptance': 'pending', 'releaseAdmission': 'held',
                      'files': {p.name: {'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in assets}}
          pathlib.Path('dist/candidate.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: onboarding-preview-candidate-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/Apparent-Preview-${{ inputs.candidate_version || '0.12.3' }}-arm64.dmg
            dist/Apparent-Preview-${{ inputs.candidate_version || '0.12.3' }}-arm64.dmg.sha256
            dist/Apparent-Preview-${{ inputs.candidate_version || '0.12.3' }}-arm64.zip
            dist/candidate.json
      - name: Remove job-private signing material
        if: always()
        run: |
          if [ -d "$APPARENT_APPLE_SIGNING_DIR" ]; then
            security delete-keychain "$APPARENT_APPLE_SIGNING_DIR/signing.keychain-db" || true
            rm -rf -- "$APPARENT_APPLE_SIGNING_DIR"
          fi
