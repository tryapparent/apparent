name: continuous delivery hermes
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hermes-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contracts:
    outputs:
      affected: ${{ steps.select.outputs.hermes }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun test enablement/ci/
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun enablement/ci/select.ts
  clean:
    runs-on: ubuntu-24.04
    container: node:22.23.0-bookworm-slim
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git python3 python3-venv
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: hermes
      - name: Prove isolated package build and compiled integration tests
        env:
          HERMES_REVISION: ${{ github.sha }}
        run: |
          test ! -d target
          test ! -d capture
          ! command -v rustc
          ! command -v cargo
          python3 -m venv /tmp/apparent-dev-hermes-clean-python
          /tmp/apparent-dev-hermes-clean-python/bin/pip install 'Pillow>=13,<14'
          /tmp/apparent-dev-hermes-clean-python/bin/python -m unittest discover -s hermes/tests -v
          npm ci --ignore-scripts --prefix hermes/desktop
          node --experimental-strip-types --test hermes/desktop/*.test.ts hermes/distribution/*.test.ts
  verify:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only Hermes build dependencies
        run: npm ci --ignore-scripts --prefix hermes/desktop
      - run: python -m pip install 'Pillow>=10.2,<13'
      - run: python -m unittest discover -s hermes/tests -v
      - run: |
          python -m pip install 'Pillow>=13,<14'
          python -m unittest discover -s hermes/tests -v
      - name: Routing, bridge and package installation contracts
        run: node --experimental-strip-types --test hermes/desktop/*.test.ts hermes/distribution/*.test.ts capture/desktop/ui/frontend/src/hermes/*.test.ts
      - name: Package exact candidate without Rust or unrelated builds
        id: package
        run: |
          job=$(mktemp -d /tmp/apparent-dev-hermes-ci-XXXXXX)
          node --experimental-strip-types hermes/desktop/package.ts "$job/release"
          echo "directory=$job/release" >> "$GITHUB_OUTPUT"
      - name: Install supported Hermes validator
        run: python -m pip install 'git+https://github.com/NousResearch/hermes-agent.git@a867bb03fb35d4727ff0e9e2c0527745d4ff27cc'
      - name: Validate installed package in an isolated profile
        env:
          PACKAGE: ${{ steps.package.outputs.directory }}
        run: |
          job=$(mktemp -d /tmp/apparent-dev-hermes-profile-XXXXXX)
          export HERMES_HOME="$job/profile"
          mkdir "$job/extracted"
          (cd "$PACKAGE" && shasum -a 256 -c ./*.sha256)
          tar -xzf "$PACKAGE"/*.tar.gz -C "$job/extracted"
          node "$job/extracted/install.cjs" --profile "$HERMES_HOME"
          hermes plugins validate "$HERMES_HOME/plugins/apparent" --install-deps
          hermes plugins doctor "$HERMES_HOME/plugins/apparent" --ci
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: hermes-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.directory }}/*.tar.gz
            ${{ steps.package.outputs.directory }}/*.sha256
          if-no-files-found: error
  publish:
    needs: [contracts, clean, verify]
    if: needs.contracts.outputs.affected == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tryapparent/apparent'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hermes-${{ github.sha }}
          path: /tmp/apparent-dev-hermes-publish
      - name: Publish the verified bytes with immutable candidate identity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cd /tmp/apparent-dev-hermes-publish
          sha256sum -c *.sha256
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 1
          archive=$(find . -maxdepth 1 -name '*.tar.gz')
          version=${archive#./apparent-hermes-}
          version=${version%.tar.gz}
          gh release create "hermes-v${version}-${SHA}" --target "$SHA" --title "Hermes ${version} (${SHA})" --prerelease --notes 'Complete Hermes Agent and Desktop plugin. Verify the checksum, extract, and run node install.cjs --profile /absolute/Hermes/profile. Requires a compatible installed Apparent native app for recording; see bundled compatibility.json. This release is not catalog admission.' ./*.tar.gz ./*.sha256
