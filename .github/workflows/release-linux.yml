name: Linux packaging
run-name: Linux packaging · source ${{ inputs.source_sha || github.sha }}

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      release_channel:
        required: true
        type: string
      verification_run_id:
        required: true
        type: string
      verification_run_attempt:
        required: true
        type: string
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      POSTHOG_CLI_API_KEY:
        required: false
      APPARENT_POSTHOG_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      bridge_commit:
        description: Signed compatibility bridge; publish aliases of already verified v2 assets.
        type: string
        default: ''
      verify_only:
        description: Run both Linux packaging gates without publishing release assets.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: linux-packaging-${{ inputs.release_channel || (inputs.bridge_commit != '' && 'compatibility' || 'verify') }}-${{ github.ref }}
  # Finish the running build/publication; GitHub coalesces to the latest pending run.
  cancel-in-progress: false

jobs:
  admit:
    if: github.repository == 'tryapparent/apparent'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      # Admission code comes from trusted main, never an unchecked event SHA.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Compatibility publication contracts
        run: node --experimental-strip-types --test capture/desktop/scripts/linux/maintenance/signing-bridge.test.ts
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_SHA: ${{ inputs.source_sha || github.sha }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          VERIFY_RUN_ID: ${{ inputs.verification_run_id }}
          VERIFY_RUN_ATTEMPT: ${{ inputs.verification_run_attempt }}
          VERIFY_ONLY: ${{ inputs.verify_only && inputs.bridge_commit == '' }}
          BRIDGE_COMMIT: ${{ inputs.bridge_commit }}
        run: node --experimental-strip-types composition/enablement/release/linux.ts

  linux:
    needs: admit
    if: needs.admit.outputs.sha != '' && inputs.bridge_commit == ''
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: ${{ needs.admit.outputs.sha }}
      RELEASE_CHANNEL: ${{ inputs.release_channel }}
      REQUEST_VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.release_channel == 'stable' && inputs.tag || '' }}
      VERIFY_ONLY: ${{ inputs.verify_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.admit.outputs.sha }}
      - name: Confirm build identity
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Prepare hosted Ubuntu package transport
        if: runner.os == 'Linux' && runner.arch == 'X64'
        # Pin the reviewed helper independently of the checked-out release tag.
        # ARM uses ubuntu-ports and retains its existing package source path.
        uses: tryapparent/apparent/.github/actions/ubuntu-apt@22b91130f8b1e8ed98d505e5a64241d34848e6a8
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Resolve shared desktop release version
        run: node --experimental-strip-types capture/desktop/scripts/release/desktop-version.ts
      - name: Build Connect client prerequisite for native tests
        working-directory: connect/client/typescript
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install build and packaging dependencies
        run: ./capture/desktop/scripts/linux/appimage/dependencies.sh
      - name: Prepare native test inputs before release Cargo
        timeout-minutes: 5
        run: |
          temporary=$(mktemp -d /tmp/apparent-dev-release-XXXXXX)
          echo "APPARENT_RELEASE_TEST_TMP=$temporary" >> "$GITHUB_ENV"
          echo "TMPDIR=$temporary" >> "$GITHUB_ENV"
          export TMPDIR="$temporary"
          python3 enablement/verification.py --base unknown --preflight
          npm --prefix capture/desktop/ui/frontend ci --ignore-scripts --no-audit --no-fund
          node capture/desktop/ui/frontend/node_modules/electron/install.js
          node --experimental-strip-types enablement/prerequisites/native.ts
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-${{ matrix.arch }}
          cache-on-failure: true
      - name: Register PostHog desktop release
        timeout-minutes: 3
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
        run: |
          node --experimental-strip-types --test capture/desktop/scripts/release/desktop-version.test.ts capture/desktop/scripts/release/posthog-release.test.ts
          node --experimental-strip-types capture/desktop/scripts/release/posthog-release.ts linux
      - name: Build with PostHog error reporting
        env:
          APPARENT_POSTHOG_TOKEN: ${{ secrets.APPARENT_POSTHOG_TOKEN }}
        run: |
          test -n "$APPARENT_RELEASE_VERSION"
          export APPARENT_RELEASE_CHANNEL=preview
          export APPARENT_REPORTING_ENVIRONMENT=production
          if [[ -n "$RELEASE_CHANNEL" ]]; then
            test "$APPARENT_RELEASE_VERSION" = "$REQUEST_VERSION"
          fi
          if [[ "$RELEASE_CHANNEL" == stable ]]; then export APPARENT_RELEASE_CHANNEL=stable; fi
          if [[ "$VERIFY_ONLY" == "true" ]]; then export APPARENT_REPORTING_ENVIRONMENT=synthetic; fi
          GITHUB_SHA="$CANDIDATE_SHA" cargo build --release --locked
      - name: Unit tests and model test executable
        run: |
          cargo test --release --locked -- --test-threads=2
          cargo test --release --locked speech:: -- --nocapture
          cargo test --release --locked --bin apparent --no-run --message-format=json > target/test-artifacts.jsonl
          test=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "apparent" and .profile.test) | .executable // empty' target/test-artifacts.jsonl)
          test -f "$test"
          echo "SPEECH_TEST=$test" >> "$GITHUB_ENV"
      - name: No build-machine CPU specialization
        run: |
          mapfile -t caches < <(jq -r 'select(.reason == "build-script-executed" and (.package_id | contains("transcribe-cpp-sys"))) | .out_dir + "/build/CMakeCache.txt"' target/test-artifacts.jsonl)
          test "${#caches[@]}" -gt 0
          for cache in "${caches[@]}"; do
            grep -x 'GGML_NATIVE:BOOL=OFF' "$cache"
            grep -x 'GGML_BACKEND_DL:BOOL=ON' "$cache"
          done
      - name: CPU tiers contain only their declared instructions
        if: matrix.arch == 'x86_64'
        run: python3 capture/desktop/scripts/linux/appimage/check-cpu-tiers.py target/release
      - name: Package
        id: package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ -n "$TAG" && "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match Cargo.toml $version" >&2
            exit 1
          fi
          ./capture/desktop/scripts/linux/appimage/appimage.sh target/release/apparent
          name="Apparent-$version-linux-${{ matrix.arch }}.AppImage"
          mkdir -p dist
          cp "target/appimage/Apparent-${{ matrix.arch }}.AppImage" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: AppImage runs headless without FUSE
        run: APPIMAGE_EXTRACT_AND_RUN=1 "dist/${{ steps.package.outputs.name }}" --help
      - name: Bundled GStreamer decodes an H.264 MP4
        run: bash capture/desktop/scripts/linux/appimage/check-appimage-decoder.sh "dist/${{ steps.package.outputs.name }}"
      - name: Bundled GStreamer encodes a playable H.264 MP4
        run: bash capture/desktop/scripts/linux/appimage/check-appimage-encoder.sh "dist/${{ steps.package.outputs.name }}"
      - name: Run two seconds of audio with the packaged CPU backend
        run: bash capture/desktop/scripts/linux/appimage/smoke-cpu.sh "dist/${{ steps.package.outputs.name }}" "$SPEECH_TEST"
      - uses: petarpetrovt/setup-sde@v6.0
        if: matrix.arch == 'x86_64'
      - name: Run packaged model on Ice Lake (AVX512-VNNI, no AVX-VNNI)
        if: matrix.arch == 'x86_64'
        timeout-minutes: 30
        env:
          APPARENT_TEST_NO_AVX_VNNI: "1"
        run: |
          sde=$(find "$SDE_PATH" -type f -name sde64 -print -quit)
          test -x "$sde"
          # Pin needs this on Ubuntu 24.04 runners.
          sudo sysctl -w kernel.yama.ptrace_scope=0
          bash capture/desktop/scripts/linux/appimage/smoke-cpu.sh "dist/${{ steps.package.outputs.name }}" "$SPEECH_TEST" "$sde" -icl
      - name: Build and verify the Amazon Linux 2023 CLI
        if: matrix.arch == 'x86_64' && hashFiles('composition/enablement/release/amazon-linux-cli/build.ts') != ''
        env:
          PRODUCER_APPIMAGE: dist/${{ steps.package.outputs.name }}
        run: node --experimental-strip-types composition/enablement/release/amazon-linux-cli/build.ts dist "$PRODUCER_APPIMAGE"
      - uses: actions/checkout@v5
        if: inputs.release_channel != ''
        with:
          ref: ${{ github.workflow_sha }}
          clean: false
          persist-credentials: false
      - name: Seal checked Linux candidate
        if: inputs.release_channel != ''
        env:
          APPARENT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_NATIVE_CHECKS: 'true'
        run: node --experimental-strip-types composition/enablement/release/manifest.ts create dist linux ${{ matrix.arch }}
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.release_channel != '' && format('stable-linux-{0}-{1}', matrix.arch, github.run_attempt) || steps.package.outputs.name }}
          path: dist/*
      - name: Clean private release test inputs
        if: always()
        run: |
          if [ -n "${APPARENT_RELEASE_TEST_TMP:-}" ]; then
            rm -rf -- "$APPARENT_RELEASE_TEST_TMP"
          fi

  signing-bridge:
    needs: admit
    if: inputs.bridge_commit != '' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Publish unchanged verified assets for legacy updaters
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_COMMIT: ${{ inputs.bridge_commit }}
        run: node --experimental-strip-types capture/desktop/scripts/linux/maintenance/signing-bridge.ts publish "$BRIDGE_COMMIT"
