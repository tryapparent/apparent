name: Agent

on:
  pull_request:
    branches: [main]
    paths: ['agent/**', 'shared/enablement/bend/**', '.github/workflows/stream-agent.yml']
  push:
    branches: [main]
    paths: ['agent/**', 'shared/enablement/bend/**', '.github/workflows/stream-agent.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feedback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - run: node --test agent/enablement/feedback.test.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: node agent/enablement/ci/bend/check.ts --proof
