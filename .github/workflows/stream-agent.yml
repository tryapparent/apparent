name: Agent

on:
  pull_request:
    branches: [main]
    paths: ['agent/**', '.github/workflows/stream-agent.yml']
  push:
    branches: [main]
    paths: ['agent/**', '.github/workflows/stream-agent.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feedback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - run: node --test agent/enablement/feedback.test.ts
