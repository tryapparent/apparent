name: Record

on:
  pull_request:
    branches: [main]
    paths:
      - "record/completion/**"
      - "record/pill/**"
      - "record/shortcuts/push-to-talk.bend"
      - "record/enablement/ci/pill/**"
      - "record/enablement/ci/bend/**"
      - "shared/enablement/bend/**"
      - ".github/workflows/stream-record.yml"
  push:
    branches: [main]
    paths:
      - "record/completion/**"
      - "record/pill/**"
      - "record/shortcuts/push-to-talk.bend"
      - "record/enablement/ci/pill/**"
      - "record/enablement/ci/bend/**"
      - "shared/enablement/bend/**"
      - ".github/workflows/stream-record.yml"

permissions:
  contents: read

jobs:
  bend:
    name: Bend completion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: node record/enablement/ci/bend/check.ts --proof
