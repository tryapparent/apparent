name: Record

on:
  pull_request:
    branches: [main]
    paths:
      - "record/completion/**"
      - "record/capture-request/**"
      - "record/media/src/assembly/crop-publication*"
      - "record/media/src/assembly/action-context.bend"
      - "record/media/src/assembly/focused-mark.bend"
      - "record/media/src/circle/circle-label.bend"
      - "record/pill/**"
      - "record/shortcuts/push-to-talk.bend"
      - "record/enablement/ci/pill/**"
      - "record/enablement/ci/bend/**"
      - "record/enablement/ci/capture-request/build.ts"
      - "shared/enablement/bend/**"
      - "shared/enablement/ci/record-inputs.ts"
      - "record/enablement/verification.json"
      - "record/enablement/performance/fixtures/host-accounting.test.ts"
      - "record/enablement/performance/fixtures/smt-subset.test.ts"
      - "record/enablement/performance/local/stop-timeline.test.ts"
      - "record/enablement/performance/native/start-spans.test.ts"
      - "record/enablement/performance/score/compare.test.ts"
      - "record/enablement/ci/performance/verify.ts"
      - "record/enablement/ci/performance/verify.test.ts"
      - "record/enablement/ci/settings/verify.ts"
      - "record/enablement/settings/package.json"
      - "record/enablement/settings/recording-fixture.ts"
      - "record/enablement/settings/recording-fixture.test.ts"
      - ".github/workflows/stream-record.yml"
  push:
    branches: [main]
    paths:
      - "record/completion/**"
      - "record/capture-request/**"
      - "record/media/src/assembly/crop-publication*"
      - "record/media/src/assembly/action-context.bend"
      - "record/media/src/assembly/focused-mark.bend"
      - "record/media/src/circle/circle-label.bend"
      - "record/pill/**"
      - "record/shortcuts/push-to-talk.bend"
      - "record/enablement/ci/pill/**"
      - "record/enablement/ci/bend/**"
      - "record/enablement/ci/capture-request/build.ts"
      - "shared/enablement/bend/**"
      - "shared/enablement/ci/record-inputs.ts"
      - "record/enablement/verification.json"
      - "record/enablement/performance/fixtures/host-accounting.test.ts"
      - "record/enablement/performance/fixtures/smt-subset.test.ts"
      - "record/enablement/performance/local/stop-timeline.test.ts"
      - "record/enablement/performance/native/start-spans.test.ts"
      - "record/enablement/performance/score/compare.test.ts"
      - "record/enablement/ci/performance/verify.ts"
      - "record/enablement/ci/performance/verify.test.ts"
      - "record/enablement/ci/settings/verify.ts"
      - "record/enablement/settings/package.json"
      - "record/enablement/settings/recording-fixture.ts"
      - "record/enablement/settings/recording-fixture.test.ts"
      - ".github/workflows/stream-record.yml"

permissions:
  contents: read

jobs:
  bend:
    name: Bend completion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      settings: ${{ steps.paths.outputs.settings }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
      - name: Select Record checks
        id: paths
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: node --experimental-strip-types record/enablement/ci/performance/verify.ts --select "$BASE_SHA"
      - uses: oven-sh/setup-bun@v2
        if: steps.paths.outputs.bend == 'true'
        with:
          bun-version: "1.3.10"
      - if: steps.paths.outputs.bend == 'true'
        run: node record/enablement/ci/bend/check.ts --proof
      - name: Verify Record manifest and synthetic performance fixtures
        if: ${{ !cancelled() && steps.paths.outputs.performance == 'true' }}
        run: node --experimental-strip-types record/enablement/ci/performance/verify.ts

  settings:
    name: Recording Settings integration
    needs: bend
    if: needs.bend.outputs.settings == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/ubuntu-apt
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
          cache: npm
          cache-dependency-path: capture/desktop/ui/frontend/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: node --experimental-strip-types record/enablement/ci/settings/verify.ts --prepare
      - run: xvfb-run -a node --experimental-strip-types record/enablement/ci/settings/verify.ts
