name: Hosted Ubuntu package transport
description: Prefer the Kernel.org Ubuntu mirror while retaining Ubuntu archive signature checks.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        test "$RUNNER_OS" = Linux
        test "$GITHUB_ACTIONS" = true
        mirror_file=/etc/apt/apt-mirrors.txt
        test -f "$mirror_file"
        test ! -L "$mirror_file"
        mirror=$(printf 'https://mirrors.edge.kernel.org/ubuntu/\tpriority:0')
        if ! grep -Fxq "$mirror" "$mirror_file"; then
          job=$(mktemp -d /tmp/apparent-dev-apt-XXXXXX)
          trap 'rm -rf "$job"' EXIT
          { printf '%s\n' "$mirror"; cat "$mirror_file"; } > "$job/mirrors"
          sudo install -o root -g root -m 0644 "$job/mirrors" "$mirror_file"
        fi
