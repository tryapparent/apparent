name: Hosted Ubuntu package transport
description: Bound mirror failures and retain Ubuntu archive signature checks.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22.23.0'
    - shell: bash
      working-directory: ${{ github.workspace }}
      run: node --experimental-strip-types enablement/ci/runner/ubuntu-apt.ts
