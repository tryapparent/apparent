name: Prefer official Ubuntu APT mirrors
description: Avoid the hosted image's failing Azure mirror before dependency installation.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -eu
        # Only the disposable GitHub-hosted Linux image may be changed.
        test "$RUNNER_OS" = Linux
        test "$RUNNER_ENVIRONMENT" = github-hosted
        mirrors=/etc/apt/apt-mirrors.txt
        # Other image layouts retain their own configured sources.
        if [ -f "$mirrors" ]; then
          # Refuse to remove a source without an existing official fallback.
          # Hosted images append a tab and priority:N after each URL.
          grep -Eq '^https://(archive|security)\.ubuntu\.com/ubuntu/?([[:space:]]+priority:[0-9]+)?[[:space:]]*$' "$mirrors"
          sudo sed -Ei '\|^https?://azure\.archive\.ubuntu\.com/ubuntu/?([[:space:]]+priority:[0-9]+)?[[:space:]]*$|d' "$mirrors"
        fi
